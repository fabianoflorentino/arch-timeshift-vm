---
- name: Converge - Tier 2 synthetic BTRFS snapshot detection (read-only role)
  hosts: all
  become: false
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    tier2_sandbox: /tmp/arch-timeshift-vm-tier2
    tier2_image: "{{ tier2_sandbox }}/btrfs.img"
    tier2_mount: "{{ tier2_sandbox }}/top"
    tier2_snapshots: "{{ tier2_mount }}/timeshift-btrfs/snapshots"
    tier2_snapshot_name: "2020-01-02_03-04-05"
    tier2_snapshot_dir: "{{ tier2_snapshots }}/{{ tier2_snapshot_name }}"
    tier2_images: "{{ tier2_sandbox }}/images"

    # Inputs consumed by the snapshot role, pointed at the sandbox.
    confirm_restore: true
    vm_name: tier2-test
    vm_memory_mib: 2048
    vm_vcpus: 2
    network_name: default
    timeshift_root: auto
    snapshot: latest
    vm_images_dir: "{{ tier2_images }}"
    vm_disk: "{{ tier2_images }}/vm.qcow2"
    vm_disk_size: 2G
    efi_size_mib: 256
    work_dir: "{{ tier2_sandbox }}/work"
    nvram_dir: "{{ tier2_sandbox }}/nvram"

    # The synthetic snapshot has no kernel/bootloader, so Phase 4 only
    # exercises the chroot plumbing here. Production defaults to false.
    boot_allow_missing_grub: true

    # Do not start the synthetic VM (no real kernel); define + undefine only.
    libvirt_start: false
    libvirt_attach_iso: false
    libvirt_graphics: none

    snapshot_required_commands:
      - btrfs
      - findmnt
      - realpath
      - qemu-img
      - qemu-nbd
      - sgdisk
      - mkfs.fat
      - mkfs.btrfs
      - blkid
      - blockdev
      - partprobe
      - modprobe
      - truncate
      - sha256sum
      - virsh
      - virt-xml-validate
      - arch-chroot
      - grub-install
      - efibootmgr

  tasks:
    - name: Cleanup any leftover mounts and NBD devices from previous runs
      ansible.builtin.shell: |
        set -uo pipefail
        # Unmount leftovers from previous runs (nested -> outer)
        for mp in {{ work_dir }}/mnt-root {{ work_dir }}/mnt {{ tier2_mount }}; do
          while findmnt --mountpoint "$mp" >/dev/null 2>&1; do
            umount -R "$mp" 2>/dev/null || umount -lR "$mp" 2>/dev/null || break
          done
        done
        # Disconnect only NBD devices whose qemu-nbd process serves the sandbox
        for nbd in /dev/nbd*; do
          [ -b "$nbd" ] || continue
          pid_file="/sys/block/$(basename "$nbd")/pid"
          [ -r "$pid_file" ] || continue
          pid="$(cat "$pid_file" 2>/dev/null || true)"
          [ -n "$pid" ] || continue
          if tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null | grep -q "{{ tier2_sandbox }}"; then
            qemu-nbd --disconnect "$nbd" >/dev/null 2>&1 || true
          fi
        done
        rm -rf {{ tier2_sandbox }}
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Load project variables
      ansible.builtin.include_vars:
        file: "{{ project_dir }}/group_vars/all.yml"
        name: project

    - name: Assert the safety default is in place
      ansible.builtin.assert:
        that:
          - project.confirm_restore is defined
          - not (project.confirm_restore | bool)
        fail_msg: "confirm_restore must default to false"

    - name: Assert required variables exist
      ansible.builtin.assert:
        that:
          - project.vm_name is defined
          - project.vm_name | length > 0
          - project.vm_disk is defined
          - project.timeshift_root is defined
          - project.work_dir is defined
        fail_msg: "group_vars/all.yml is missing required variables"

    - name: Check the effective user id
      ansible.builtin.command: id -u
      register: tier2_uid
      changed_when: false

    - name: Assert the scenario runs as root
      ansible.builtin.assert:
        that:
          - tier2_uid.stdout | trim == '0'
        fail_msg: >-
          Tier 2 needs root (BTRFS subvolume and loop mount). Run it with:
          sudo -E make test-integration
        quiet: true

    - name: Exercise detection and validation on a synthetic snapshot
      when: tier2_uid.stdout | trim == '0'
      tags:
        - molecule-idempotence-notest
      block:
        - name: Create the sandbox directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ tier2_sandbox }}"
            - "{{ tier2_mount }}"
            - "{{ tier2_images }}"
          changed_when: false

        - name: Create the BTRFS backing image
          ansible.builtin.command:
            cmd: "truncate --size 512M {{ tier2_image }}"
          changed_when: false

        - name: Format the backing image as BTRFS
          ansible.builtin.command:
            cmd: "mkfs.btrfs --quiet --force {{ tier2_image }}"
          changed_when: false

        # The mount module would manage /etc/fstab; use mount(8) directly so
        # the host fstab is provably untouched.
        - name: Mount the synthetic BTRFS top-level without touching fstab  # noqa: command-instead-of-module
          ansible.builtin.command:
            cmd: "mount --types btrfs --options loop {{ tier2_image }} {{ tier2_mount }}"
          changed_when: false

        - name: Find the loop device backing the synthetic filesystem
          ansible.builtin.command:
            cmd: "findmnt --noheadings --output SOURCE --target {{ tier2_mount }}"
          register: tier2_loop
          changed_when: false

        - name: Create the synthetic Timeshift snapshot layout
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ tier2_snapshots }}"
            - "{{ tier2_snapshot_dir }}"
          changed_when: false

        - name: Create the @ and @home subvolumes
          ansible.builtin.command:
            cmd: "btrfs subvolume create {{ tier2_snapshot_dir }}/{{ item }}"
          loop:
            - "@"
            - "@home"
          changed_when: false

        - name: Mark the @ subvolume read-only
          ansible.builtin.command:
            cmd: "btrfs property set -t subvol {{ tier2_snapshot_dir }}/@ ro true"
          changed_when: false

        - name: Mark the @home subvolume read-only
          ansible.builtin.command:
            cmd: "btrfs property set -t subvol {{ tier2_snapshot_dir }}/@home ro true"
          changed_when: false

        - name: Write the synthetic snapshot metadata
          ansible.builtin.copy:
            content: |
              {
                "type": "btrfs",
                "subvolumes": {"@": [], "@home": []}
              }
            dest: "{{ tier2_snapshot_dir }}/info.json"
            mode: "0644"
          changed_when: false

        - name: Point detection at the synthetic device
          ansible.builtin.set_fact:
            timeshift_device: "{{ tier2_loop.stdout | trim }}"

        - name: Run the snapshot role
          ansible.builtin.include_role:
            name: snapshot

        - name: Assert detection and validation succeeded
          ansible.builtin.assert:
            that:
              - snapshot_root_dir == tier2_snapshots
              - resolved_snapshot == tier2_snapshot_name
              - snapshot_root == tier2_snapshot_dir + '/@'
              - snapshot_home == tier2_snapshot_dir + '/@home'
              - vm_disk_real == tier2_images + '/vm.qcow2'
            fail_msg: "Synthetic BTRFS detection/validation did not match"
            success_msg: >-
              Validated synthetic snapshot {{ resolved_snapshot }} at
              {{ snapshot_root_dir }}

    - name: Exercise the disk role with atomic swap and ephemeral mounts
      when: tier2_uid.stdout | trim == '0'
      tags:
        - molecule-idempotence-notest
      block:
        - name: Hash the host fstab before disk operations
          ansible.builtin.command:
            cmd: sha256sum /etc/fstab
          register: tier2_fstab_before
          changed_when: false

        - name: Run the disk role
          ansible.builtin.include_role:
            name: disk

        - name: Assert disk role published required facts
          ansible.builtin.assert:
            that:
              - nbd_device is defined
              - nbd_device | length > 0
              - vm_efi_uuid is defined
              - vm_efi_uuid | length > 0
              - vm_btrfs_uuid is defined
              - vm_btrfs_uuid | length > 0
              - vm_mount_root is defined
              - vm_mount_root | length > 0
              - vm_mount_efi is defined
              - vm_mount_efi | length > 0
            fail_msg: "Disk role did not publish required facts"

        - name: Assert the disk file exists and is valid qcow2
          ansible.builtin.command:
            cmd: qemu-img info -U {{ vm_disk }}
          register: tier2_disk_info
          changed_when: false

        - name: Assert qcow2 format
          ansible.builtin.assert:
            that:
              - "'file format: qcow2' in tier2_disk_info.stdout"
            fail_msg: "VM disk is not qcow2 format"

        - name: Assert ephemeral mounts exist
          ansible.builtin.command:
            cmd: findmnt --mountpoint {{ vm_mount_root }} --noheadings
          register: tier2_root_mount
          changed_when: false

        - name: Assert root is mounted
          ansible.builtin.assert:
            that:
              - tier2_root_mount.rc == 0
            fail_msg: "BTRFS root is not mounted at {{ vm_mount_root }}"

        - name: Assert EFI is mounted
          ansible.builtin.command:
            cmd: findmnt --mountpoint {{ vm_mount_efi }} --noheadings
          register: tier2_efi_mount
          changed_when: false

        - name: Assert EFI mount succeeded
          ansible.builtin.assert:
            that:
              - tier2_efi_mount.rc == 0
            fail_msg: "EFI is not mounted at {{ vm_mount_efi }}"

        - name: Hash the host fstab after disk operations
          ansible.builtin.command:
            cmd: sha256sum /etc/fstab
          register: tier2_fstab_after
          changed_when: false

        - name: Assert host fstab was not modified
          ansible.builtin.assert:
            that:
              - tier2_fstab_before.stdout == tier2_fstab_after.stdout
            fail_msg: "Host /etc/fstab was modified by disk operations"
            success_msg: "Host /etc/fstab remains intact"

    - name: Exercise the restore role with snapshot subvolumes
      when: tier2_uid.stdout | trim == '0'
      tags:
        - molecule-idempotence-notest
      block:
        - name: Run the restore role
          ansible.builtin.include_role:
            name: restore

        - name: Assert restore role mounted the restored root
          ansible.builtin.command:
            cmd: findmnt --mountpoint {{ vm_mount_root }}-root --noheadings
          register: tier2_restore_root_mount
          changed_when: false

        - name: Assert restored root is mounted
          ansible.builtin.assert:
            that:
              - tier2_restore_root_mount.rc == 0
            fail_msg: "Restored root is not mounted at {{ vm_mount_root }}-root"

        - name: Assert restore role mounted the restored home
          ansible.builtin.command:
            cmd: findmnt --mountpoint {{ vm_mount_root }}-root/home --noheadings
          register: tier2_restore_home_mount
          changed_when: false

        - name: Assert restored home is mounted
          ansible.builtin.assert:
            that:
              - tier2_restore_home_mount.rc == 0
            fail_msg: "Restored home is not mounted at {{ vm_mount_root }}-root/home"

        - name: Assert restore role mounted EFI into restored system
          ansible.builtin.command:
            cmd: findmnt --mountpoint {{ vm_mount_root }}-root/boot --noheadings
          register: tier2_restore_efi_mount
          changed_when: false

        - name: Assert restored EFI is mounted
          ansible.builtin.assert:
            that:
              - tier2_restore_efi_mount.rc == 0
            fail_msg: "Restored EFI is not mounted at {{ vm_mount_root }}-root/boot"

        - name: Assert VM fstab was installed
          ansible.builtin.stat:
            path: "{{ vm_mount_root }}-root/etc/fstab"
          register: tier2_fstab_file

        - name: Assert fstab exists and contains BTRFS entries
          ansible.builtin.assert:
            that:
              - tier2_fstab_file.stat.exists
            fail_msg: "VM fstab was not installed"

        - name: Read the installed fstab
          ansible.builtin.slurp:
            src: "{{ vm_mount_root }}-root/etc/fstab"
          register: tier2_installed_fstab

        - name: Assert fstab contains correct UUID references
          ansible.builtin.assert:
            that:
              - vm_btrfs_uuid in (tier2_installed_fstab.content | b64decode)
              - vm_efi_uuid in (tier2_installed_fstab.content | b64decode)
              - "'subvol=/@' in (tier2_installed_fstab.content | b64decode)"
              - "'subvol=/@home' in (tier2_installed_fstab.content | b64decode)"
            fail_msg: "VM fstab does not contain correct UUID references"

        - name: Read the cloned machine-id
          ansible.builtin.slurp:
            src: "{{ vm_mount_root }}-root/etc/machine-id"
          register: tier2_machine_id

        - name: Read the cloned hostname
          ansible.builtin.slurp:
            src: "{{ vm_mount_root }}-root/etc/hostname"
          register: tier2_hostname

        - name: Assert the clone identity was reset
          ansible.builtin.assert:
            that:
              - tier2_machine_id.content | b64decode | trim == ''
              - tier2_hostname.content | b64decode | trim == vm_name
            fail_msg: "Clone identity was not reset (machine-id/hostname)"

    - name: Exercise the boot role with chroot and GRUB installation
      when: tier2_uid.stdout | trim == '0'
      tags:
        - molecule-idempotence-notest
      block:
        - name: Run the boot role
          ansible.builtin.include_role:
            name: boot

        - name: Assert the boot role prepared the chroot
          ansible.builtin.assert:
            that:
              - boot_chroot_prepared | default(false) | bool
            fail_msg: "Boot role did not prepare the chroot"

    - name: Exercise the libvirt role with define and undefine
      when: tier2_uid.stdout | trim == '0'
      tags:
        - molecule-idempotence-notest
      block:
        - name: Hash the host fstab before libvirt operations
          ansible.builtin.command:
            cmd: sha256sum /etc/fstab
          register: tier2_fstab_pre_libvirt
          changed_when: false

        - name: Run the libvirt role
          ansible.builtin.include_role:
            name: libvirt

        - name: Read the generated domain XML
          ansible.builtin.slurp:
            src: "{{ work_dir }}/{{ vm_name }}.xml"
          register: tier2_domain_xml

        - name: Assert the XML was generated
          ansible.builtin.assert:
            that:
              - tier2_domain_xml.content | b64decode | length > 0
            fail_msg: "Libvirt domain XML was not generated"

        - name: Assert the XML contains the VM name
          ansible.builtin.assert:
            that:
              - vm_name in (tier2_domain_xml.content | b64decode)
              - vm_disk in (tier2_domain_xml.content | b64decode)
              - "'cdrom' not in (tier2_domain_xml.content | b64decode)"
            fail_msg: "Libvirt domain XML does not contain expected content"

        - name: Run teardown (undefine the domain)
          ansible.builtin.include_tasks:
            file: "{{ project_dir }}/roles/libvirt/tasks/teardown.yml"

        - name: Assert the domain was undefined
          ansible.builtin.command:
            cmd: virsh dominfo {{ vm_name }}
          register: tier2_undefine_check
          failed_when: tier2_undefine_check.rc == 0
          changed_when: false

        - name: Hash the host fstab after libvirt operations
          ansible.builtin.command:
            cmd: sha256sum /etc/fstab
          register: tier2_fstab_post_libvirt
          changed_when: false

        - name: Assert host fstab was not modified by libvirt
          ansible.builtin.assert:
            that:
              - tier2_fstab_pre_libvirt.stdout == tier2_fstab_post_libvirt.stdout
            fail_msg: "Host /etc/fstab was modified by libvirt operations"
            success_msg: "Host /etc/fstab remains intact after libvirt"
      always:
        - name: Aggressive cleanup of all tier2 mounts and NBD devices
          ansible.builtin.shell: |
            set -uo pipefail
            # Unmount all tier2 mounts recursively (nested -> outer)
            for mp in {{ work_dir }}/mnt-root {{ work_dir }}/mnt {{ tier2_mount }}; do
              while findmnt --mountpoint "$mp" >/dev/null 2>&1; do
                umount -R "$mp" 2>/dev/null || umount -lR "$mp" 2>/dev/null || break
              done
            done
            # Disconnect the tracked NBD device, if any
            if [ -n "{{ nbd_device | default('') }}" ] && [ -b "{{ nbd_device | default('/dev/null') }}" ]; then
              qemu-nbd --disconnect "{{ nbd_device | default('') }}" >/dev/null 2>&1 || true
            fi
            # Disconnect any other NBD device that still serves the sandbox
            for nbd in /dev/nbd*; do
              [ -b "$nbd" ] || continue
              pid_file="/sys/block/$(basename "$nbd")/pid"
              [ -r "$pid_file" ] || continue
              pid="$(cat "$pid_file" 2>/dev/null || true)"
              [ -n "$pid" ] || continue
              if tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null | grep -q "{{ tier2_sandbox }}"; then
                qemu-nbd --disconnect "$nbd" >/dev/null 2>&1 || true
              fi
            done
            rm -rf {{ tier2_sandbox }}
          args:
            executable: /bin/bash
          changed_when: false
          failed_when: false
