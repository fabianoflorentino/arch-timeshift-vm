---
- name: Converge - Tier 2 synthetic BTRFS snapshot detection
  hosts: all
  become: false
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    tier2_sandbox: /tmp/arch-timeshift-vm-tier2
    tier2_image: "{{ tier2_sandbox }}/btrfs.img"
    tier2_mount: "{{ tier2_sandbox }}/top"
    snapshot_top_mount_point: "{{ tier2_mount }}"
    tier2_snapshots: "{{ tier2_mount }}/timeshift-btrfs/snapshots"
    tier2_snapshot_name: "2020-01-02_03-04-05"
    tier2_snapshot_dir: "{{ tier2_snapshots }}/{{ tier2_snapshot_name }}"
    tier2_images: "{{ tier2_sandbox }}/images"

    # Second sandbox that mimics the reference host layout (`subvol=/@`): the
    # filesystem default subvolume is not the top-level, so nothing exposes
    # fsroot "/" and the auto-mount fallback has to do the work.
    tier2b_image: "{{ tier2_sandbox }}/btrfs-subvol-root.img"
    tier2b_mount: "{{ tier2_sandbox }}/subvol-root"
    tier2b_snapshots: "{{ tier2b_mount }}/timeshift-btrfs/snapshots"
    tier2b_snapshot_name: "2021-02-03_04-05-06"
    tier2b_snapshot_dir: "{{ tier2b_snapshots }}/{{ tier2b_snapshot_name }}"
    tier2b_top_mount_point: "{{ tier2_sandbox }}/auto-top"

    # Inputs consumed by the snapshot role, pointed at the sandbox.
    confirm_restore: true
    vm_name: tier2-test
    vm_memory_mib: 2048
    vm_vcpus: 2
    network_name: default
    vm_network_mode: default
    timeshift_root: auto
    snapshot: latest
    vm_images_dir: "{{ tier2_images }}"
    vm_disk: "{{ tier2_images }}/vm.qcow2"
    vm_disk_size: 2G
    efi_size_mib: 256
    work_dir: "{{ tier2_sandbox }}/work"
    nvram_dir: "{{ tier2_sandbox }}/nvram"

    # The synthetic snapshot has no kernel/bootloader, so Phase 4 only
    # exercises the chroot plumbing here. Production defaults to false.
    boot_allow_missing_grub: true

    # Do not start the synthetic VM (no real kernel); define + undefine only.
    libvirt_start: false
    libvirt_attach_iso: false
    libvirt_graphics: none

    snapshot_required_commands:
      - btrfs
      - findmnt
      - mount
      - umount
      - realpath
      - qemu-img
      - qemu-nbd
      - sgdisk
      - mkfs.fat
      - mkfs.btrfs
      - blkid
      - blockdev
      - partprobe
      - modprobe
      - truncate
      - sha256sum
      - virsh
      - virt-xml-validate
      - arch-chroot
      - grub-install
      - efibootmgr

  tasks:
    - name: Cleanup any leftover mounts and NBD devices from previous runs
      ansible.builtin.shell: |
        set -uo pipefail
        # Unmount leftovers from previous runs (nested -> outer)
        for mp in {{ work_dir }}/mnt-root {{ work_dir }}/mnt {{ tier2_mount }} \
                  {{ tier2b_mount }} {{ tier2b_top_mount_point }}; do
          while findmnt --mountpoint "$mp" >/dev/null 2>&1; do
            umount -R "$mp" 2>/dev/null || umount -lR "$mp" 2>/dev/null || break
          done
        done
        # Disconnect only NBD devices whose qemu-nbd process serves the sandbox
        for nbd in /dev/nbd*; do
          [ -b "$nbd" ] || continue
          pid_file="/sys/block/$(basename "$nbd")/pid"
          [ -r "$pid_file" ] || continue
          pid="$(cat "$pid_file" 2>/dev/null || true)"
          [ -n "$pid" ] || continue
          if tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null | grep -q "{{ tier2_sandbox }}"; then
            qemu-nbd --disconnect "$nbd" >/dev/null 2>&1 || true
          fi
        done
        # Detach loop devices a previous run left attached, before the
        # images they point at are removed
        losetup -j "{{ tier2_sandbox }}" | cut -d: -f1 | while read -r loop; do
          losetup --detach "$loop" 2>/dev/null || true
        done
        rm -rf {{ tier2_sandbox }}
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Load project variables
      ansible.builtin.include_vars:
        file: "{{ project_dir }}/group_vars/all.yml"
        name: project

    - name: Assert the safety default is in place
      ansible.builtin.assert:
        that:
          - project.confirm_restore is defined
          - not (project.confirm_restore | bool)
        fail_msg: "confirm_restore must default to false"

    - name: Assert required variables exist
      ansible.builtin.assert:
        that:
          - project.vm_name is defined
          - project.vm_name | length > 0
          - project.vm_disk is defined
          - project.timeshift_root is defined
          - project.work_dir is defined
        fail_msg: "group_vars/all.yml is missing required variables"

    - name: Check the effective user id
      ansible.builtin.command: id -u
      register: tier2_uid
      changed_when: false

    - name: Assert the scenario runs as root
      ansible.builtin.assert:
        that:
          - tier2_uid.stdout | trim == '0'
        fail_msg: >-
          Tier 2 needs root (BTRFS subvolume and loop mount). Run it with:
          sudo -E make test-integration
        quiet: true

    - name: Exercise detection and validation on a synthetic snapshot
      when: tier2_uid.stdout | trim == '0'
      tags:
        - molecule-idempotence-notest
      block:
        - name: Create the sandbox directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ tier2_sandbox }}"
            - "{{ tier2_mount }}"
            - "{{ tier2_images }}"
          changed_when: false

        - name: Create the BTRFS backing image
          ansible.builtin.command:
            cmd: "truncate --size 512M {{ tier2_image }}"
          changed_when: false

        - name: Format the backing image as BTRFS
          ansible.builtin.command:
            cmd: "mkfs.btrfs --quiet --force {{ tier2_image }}"
          changed_when: false

        # A persistent loop device, not `mount -o loop`: that option sets the
        # loop autoclear bit, so unmounting to hand the top-level over to the
        # role would detach the very device the role has to mount read-only.
        - name: Attach the backing image to a persistent loop device  # noqa: command-instead-of-module
          ansible.builtin.command:
            cmd: "losetup --find --show {{ tier2_image }}"
          register: tier2_loop
          changed_when: false

        # The mount module would manage /etc/fstab; use mount(8) directly so
        # the host fstab is provably untouched.
        - name: Mount the synthetic BTRFS top-level without touching fstab  # noqa: command-instead-of-module
          ansible.builtin.command:
            cmd: "mount --types btrfs {{ tier2_loop.stdout | trim }} {{ tier2_mount }}"
          changed_when: false

        - name: Create the synthetic Timeshift snapshot layout
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ tier2_snapshots }}"
            - "{{ tier2_snapshot_dir }}"
          changed_when: false

        - name: Create the @ and @home subvolumes
          ansible.builtin.command:
            cmd: "btrfs subvolume create {{ tier2_snapshot_dir }}/{{ item }}"
          loop:
            - "@"
            - "@home"
          changed_when: false

        - name: Mark the @ subvolume read-only
          ansible.builtin.command:
            cmd: "btrfs property set -t subvol {{ tier2_snapshot_dir }}/@ ro true"
          changed_when: false

        - name: Mark the @home subvolume read-only
          ansible.builtin.command:
            cmd: "btrfs property set -t subvol {{ tier2_snapshot_dir }}/@home ro true"
          changed_when: false

        - name: Write the synthetic snapshot metadata
          ansible.builtin.copy:
            content: |
              {
                "created": "1577934245",
                "sys-uuid": "11111111-2222-3333-4444-555555555555",
                "sys-distro": "Arch rolling",
                "app-version": "26.09.0",
                "tags": "daily",
                "live": "false",
                "type": "btrfs",
                "subvolumes": {"@": [], "@home": []}
              }
            dest: "{{ tier2_snapshot_dir }}/info.json"
            mode: "0644"
          changed_when: false

        - name: Point detection at the synthetic device
          ansible.builtin.set_fact:
            timeshift_device: "{{ tier2_loop.stdout | trim }}"

        # The layout stays mounted read-write: the run streams from a
        # copy-on-write copy, and `btrfs subvolume snapshot` needs a writable
        # mount of the same filesystem to create it on. The auto-mount fallback
        # is exercised by the next block instead.
        - name: Run the snapshot role
          ansible.builtin.include_role:
            name: snapshot
          vars:
            snapshot_stage_root: "{{ tier2_mount }}/stage"
            # The synthetic image is 512M; the 1G production margin is sized for
            # a real host filesystem.
            snapshot_stage_min_free_bytes: "1M"

        - name: Assert detection, validation and staging succeeded
          ansible.builtin.assert:
            that:
              - snapshot_root_dir == tier2_snapshots
              - resolved_snapshot == tier2_snapshot_name
              - snapshot_source_root == tier2_snapshot_dir + '/@'
              - snapshot_staged | bool
              - snapshot_root == tier2_mount + '/stage/timeshift-btrfs/snapshots/' + tier2_snapshot_name + '/@'
              - snapshot_home == tier2_mount + '/stage/timeshift-btrfs/snapshots/' + tier2_snapshot_name + '/@home'
              - vm_disk_real == tier2_images + '/vm.qcow2'
            fail_msg: "Synthetic BTRFS detection/validation/staging did not match"
            success_msg: >-
              Validated and staged synthetic snapshot {{ resolved_snapshot }}

        - name: Release the synthetic top-level mount
          ansible.builtin.command:
            argv:
              - umount
              - "{{ tier2_mount }}"
          changed_when: true

        - name: Inspect the top-level mount left behind
          ansible.builtin.command:
            cmd: "findmnt --noheadings --mountpoint {{ tier2_mount }}"
          register: tier2_top_teardown
          changed_when: false
          failed_when: false

        - name: Assert the temporary top-level mount is gone
          ansible.builtin.assert:
            that:
              - tier2_top_teardown.rc != 0
            fail_msg: "The ephemeral top-level mount was not released"
            success_msg: "Ephemeral top-level mount released"

        # The role keeps an ephemeral top-level mounted until it fails, so the
        # read-only mount would still be holding the loop device here. Releasing
        # it first also keeps the next block from inheriting a live mount it never
        # created, which is what made it read the wrong filesystem.
        - name: Detach the loop device backing the synthetic filesystem
          ansible.builtin.command:  # noqa command-instead-of-module
            cmd: "losetup --detach {{ tier2_loop.stdout | trim }}"
          changed_when: false

    - name: Exercise auto-detection on a subvol=/@-style layout without a top-level mount
      when: tier2_uid.stdout | trim == '0'
      tags:
        - molecule-idempotence-notest
      block:
        # This block re-runs the snapshot role against another filesystem and
        # then releases its temporary mount, so the resolved facts it publishes
        # must not leak into the blocks below (which restore from the layout
        # built by the first block).
        - name: Save the snapshot facts resolved by the first block
          ansible.builtin.set_fact:
            tier2_saved_snapshot_facts:
              resolved_snapshot: "{{ resolved_snapshot }}"
              snapshot_root_dir: "{{ snapshot_root_dir }}"
              snapshot_dir: "{{ snapshot_dir }}"
              snapshot_root: "{{ snapshot_root }}"
              snapshot_home: "{{ snapshot_home }}"
        # Reproduction of the reference host: the filesystem default subvolume
        # is @root instead of the top-level (subvolid=5), so no mount exposes
        # fsroot "/" and Timeshift's snapshots are unreachable from /.
        - name: Create the sandbox directories for the layout under test
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ tier2b_mount }}"
            - "{{ tier2b_top_mount_point }}"
          changed_when: false

        - name: Create the BTRFS backing image for the layout under test
          ansible.builtin.command:
            cmd: "truncate --size 256M {{ tier2b_image }}"
          changed_when: false

        - name: Format the backing image as BTRFS
          ansible.builtin.command:
            cmd: "mkfs.btrfs --quiet --force {{ tier2b_image }}"
          changed_when: false

        - name: Mount the layout under test with its default subvolume  # noqa: command-instead-of-module
          ansible.builtin.command:
            cmd: "mount --types btrfs --options loop {{ tier2b_image }} {{ tier2b_mount }}"
          changed_when: false

        - name: Find the loop device backing the layout under test
          ansible.builtin.command:
            cmd: "findmnt --noheadings --output SOURCE --target {{ tier2b_mount }}"
          register: tier2b_loop
          changed_when: false

        - name: Create the Timeshift snapshot layout inside the top-level
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ tier2b_snapshots }}"
            - "{{ tier2b_snapshot_dir }}"
          changed_when: false

        - name: Create the @ and @home subvolumes of the snapshot
          ansible.builtin.command:
            cmd: "btrfs subvolume create {{ tier2b_snapshot_dir }}/{{ item }}"
          loop:
            - "@"
            - "@home"
          changed_when: false

        - name: Mark both snapshot subvolumes read-only
          ansible.builtin.command:
            cmd: "btrfs property set -t subvol {{ tier2b_snapshot_dir }}/{{ item }} ro true"
          loop:
            - "@"
            - "@home"
          changed_when: false

        - name: Write the snapshot metadata
          ansible.builtin.copy:
            content: |
              {
                "created": "1612325106",
                "sys-uuid": "11111111-2222-3333-4444-555555555555",
                "sys-distro": "Arch rolling",
                "app-version": "26.09.0",
                "tags": "weekly",
                "live": "false",
                "type": "btrfs",
                "subvolumes": {"@": [], "@home": []}
              }
            dest: "{{ tier2b_snapshot_dir }}/info.json"
            mode: "0644"
          changed_when: false

        - name: Create the @root subvolume standing in for subvol=/
          ansible.builtin.command:
            cmd: "btrfs subvolume create {{ tier2b_mount }}/@root"
          changed_when: false

        - name: Make @root the default subvolume of the filesystem
          ansible.builtin.command:
            cmd: "btrfs subvolume set-default {{ tier2b_mount }}/@root"
          changed_when: false

        - name: Release the layout under test before the new default takes effect
          ansible.builtin.command:
            cmd: "umount {{ tier2b_mount }}"
          changed_when: false

        - name: Remount so the new default subvolume takes effect  # noqa: command-instead-of-module
          ansible.builtin.command:
            cmd: "mount --types btrfs --options loop {{ tier2b_image }} {{ tier2b_mount }}"
          changed_when: false

        - name: Inspect the filesystem root exposed by the layout under test
          ansible.builtin.command:
            cmd: "findmnt --raw --noheadings --output FSROOT --mountpoint {{ tier2b_mount }}"
          register: tier2b_fsroot
          changed_when: false

        - name: Verify the layout under test hides the top-level
          ansible.builtin.assert:
            that:
              - tier2b_fsroot.rc == 0
              - tier2b_fsroot.stdout | trim | length > 0
              - tier2b_fsroot.stdout | trim != '/'
            fail_msg: >-
              {{ tier2b_mount }} must expose a subvolume other than the
              top-level (got fsroot '{{ tier2b_fsroot.stdout | trim }}'), like a
              real `subvol=/@` host. Otherwise the auto-mount path is not
              exercised.
            success_msg: "No fsroot \"/\" mount: the auto-mount fallback is required"

        - name: Run the snapshot role with auto-detection enabled
          ansible.builtin.include_role:
            name: snapshot
          vars:
            timeshift_device: "{{ tier2b_loop.stdout | trim }}"
            snapshot_top_mount_point: "{{ tier2b_top_mount_point }}"
            # This layout is mounted read-write at tier2b_mount (@root is the
            # default subvolume, so the run reaches the snapshots through its own
            # read-only top-level mount but creates the copy on tier2b_mount).
            # stage-check, not stage: the copy persists in tier2b_image, and the
            # staging block below reuses the same image.
            snapshot_stage_root: "{{ tier2b_mount }}/stage-check"
            snapshot_stage_min_free_bytes: "1M"

        - name: Assert the top-level was mounted and the snapshot staged
          ansible.builtin.assert:
            that:
              - snapshot_top_mount == tier2b_top_mount_point
              - snapshot_top_mount_temporary | bool
              # The layout was built through {{ tier2b_mount }} and is reached
              # through the temporary mount instead, so the paths differ while
              # the subvolume they expose is the same one.
              - snapshot_root_dir == tier2b_top_mount_point + '/timeshift-btrfs/snapshots'
              - resolved_snapshot == tier2b_snapshot_name
              - snapshot_source_root == tier2b_top_mount_point
                + '/timeshift-btrfs/snapshots/' + tier2b_snapshot_name + '/@'
              - snapshot_staged | bool
              - snapshot_root == tier2b_mount
                + '/stage-check/timeshift-btrfs/snapshots/' + tier2b_snapshot_name + '/@'
              - snapshot_home == tier2b_mount
                + '/stage-check/timeshift-btrfs/snapshots/' + tier2b_snapshot_name + '/@home'
            fail_msg: >-
              Auto-detection did not resolve and stage the snapshot under the
              unmounted top-level: top={{ snapshot_top_mount }} root={{ snapshot_root_dir }}
            success_msg: >-
              Resolved and staged {{ resolved_snapshot }} through the temporary
              read-only top-level mount at {{ snapshot_top_mount }}

        - name: Inspect the temporary top-level mount options
          ansible.builtin.command:
            cmd: "findmnt --raw --noheadings --output FSROOT,OPTIONS --mountpoint {{ tier2b_top_mount_point }}"
          register: tier2b_top_mount
          changed_when: false

        - name: Assert the temporary top-level mount is the top-level, read-only
          ansible.builtin.assert:
            that:
              - tier2b_top_mount.rc == 0
              - tier2b_top_mount.stdout | trim | split(' ') | first == '/'
              - "'ro' in (tier2b_top_mount.stdout | trim | split(' ') | last | split(','))"
            fail_msg: "Unexpected ephemeral mount: {{ tier2b_top_mount.stdout }}"
            success_msg: "Ephemeral mount is the top-level, read-only"

        - name: Release the temporary top-level mount
          ansible.builtin.include_tasks: >-
            {{ playbook_dir }}/../../roles/snapshot/tasks/unmount_btrfs_top.yml
          vars:
            snapshot_top_mount_point: "{{ tier2b_top_mount_point }}"

        - name: Assert the temporary top-level mount is gone
          ansible.builtin.command:
            cmd: "findmnt --noheadings --mountpoint {{ tier2b_top_mount_point }}"
          register: tier2b_top_teardown
          changed_when: false
          failed_when: false

        - name: Assert nothing was left behind
          ansible.builtin.assert:
            that:
              - tier2b_top_teardown.rc != 0
            fail_msg: "The ephemeral top-level mount was not released"
            success_msg: "Ephemeral top-level mount released"

        - name: Release the layout under test before the next block
          ansible.builtin.shell: |
            set -uo pipefail
            while findmnt --mountpoint {{ tier2b_mount }} >/dev/null 2>&1; do
              umount -R {{ tier2b_mount }} 2>/dev/null || umount -lR {{ tier2b_mount }} 2>/dev/null || break
            done
          args:
            executable: /bin/bash
          changed_when: false
          failed_when: false

      always:
        - name: Restore the snapshot facts resolved by the first block
          ansible.builtin.set_fact:
            resolved_snapshot: "{{ tier2_saved_snapshot_facts.resolved_snapshot }}"
            snapshot_root_dir: "{{ tier2_saved_snapshot_facts.snapshot_root_dir }}"
            snapshot_dir: "{{ tier2_saved_snapshot_facts.snapshot_dir }}"
            snapshot_root: "{{ tier2_saved_snapshot_facts.snapshot_root }}"
            snapshot_home: "{{ tier2_saved_snapshot_facts.snapshot_home }}"

    - name: Exercise a failing preflight and assert the mount is released
      when: tier2_uid.stdout | trim == '0'
      tags:
        - molecule-idempotence-notest
      block:
        # playbooks/preflight.yml owns the temporary top-level mount and releases
        # it in an `always`, so a guard that aborts the play must not leave the
        # host holding a read-only top-level mount of its own snapshots. This
        # block replays the real playbook as a child process, because `always`
        # is a play-level guarantee that cannot be reached with include_tasks.
        - name: Create the sandbox directory for the child play
          ansible.builtin.file:
            path: "{{ tier2_sandbox }}"
            state: directory
            mode: "0755"
          changed_when: false

        - name: Mount the layout under test again
          ansible.builtin.command:  # noqa command-instead-of-module
            cmd: "mount --types btrfs --options loop {{ tier2b_image }} {{ tier2b_mount }}"
          changed_when: false

        - name: Find the loop device backing the layout under test
          ansible.builtin.command:
            cmd: "findmnt --noheadings --raw --output SOURCE --target {{ tier2b_mount }}"
          register: tier2c_loop
          changed_when: false

        # findmnt renders a Btrfs mount of a non-top-level subvolume as
        # /dev/loopN[/@root]; that suffix is display sugar, and the default
        # subvolume was already switched to @root above. Strip it, the same way
        # the role normalizes the root filesystem source, so the child play
        # receives a device it can mount.
        - name: Turn the mount source into a usable device path
          ansible.builtin.set_fact:
            tier2c_device: "{{ tier2c_loop.stdout | trim | regex_replace('\\[[^]]*\\]$', '') }}"

        - name: Collect the preflight variables to replay in the child play
          ansible.builtin.set_fact:
            tier2c_preflight_vars:
              vm_name: "{{ vm_name }}"
              vm_images_dir: "{{ vm_images_dir }}"
              vm_disk: "{{ vm_disk }}"
              vm_disk_size: "{{ vm_disk_size }}"
              work_dir: "{{ work_dir }}"
              # Forwarded verbatim: this list is the one already validated on
              # this host, so the child play cannot abort on the command guard
              # instead of on the missing snapshot this test is about.
              snapshot_required_commands: "{{ snapshot_required_commands }}"
              confirm_restore: true
              # A snapshot that does not exist: the role has to mount the
              # top-level before it can look the snapshot up, so the guard fires
              # with the mount already in place.
              snapshot: "2099-01-01_00-00-00"
              timeshift_device: "{{ tier2c_device }}"
              snapshot_top_mount_point: "{{ tier2b_top_mount_point }}"

        - name: Write the extra vars of the child play
          ansible.builtin.copy:
            content: "{{ tier2c_preflight_vars | to_nice_json }}\n"
            dest: "{{ tier2_sandbox }}/preflight-failure-vars.json"
            mode: "0600"
          changed_when: false

        - name: Run the preflight playbook against a snapshot that does not exist
          ansible.builtin.command:
            argv:
              # -m, not the console script: the interpreter is the one this play
              # already runs under, so the child play sees the same collections
              # and the same ansible.cfg.
              - "{{ ansible_playbook_python }}"
              - -m
              - ansible.cli.playbook
              - "{{ project_dir }}/playbooks/preflight.yml"
              - --connection
              - local
              - --extra-vars
              - "@{{ tier2_sandbox }}/preflight-failure-vars.json"
            # The project directory holds the ansible.cfg that pins
            # collections_path; without it the child play resolves collections
            # from ~/.ansible and the roles can miss modules.
            chdir: "{{ project_dir }}"
          register: tier2c_preflight
          changed_when: false
          failed_when: false

        # The child writes its play report to stdout, but a failure raised by a
        # module in a nested include lands on stderr depending on the callback,
        # so both streams are kept: a silent rc=2 is the hardest failure to read.
        - name: Keep both output streams of the child play for diagnosis
          ansible.builtin.copy:
            content: |
              === rc={{ tier2c_preflight.rc }} ===
              === stdout ===
              {{ tier2c_preflight.stdout }}
              === stderr ===
              {{ tier2c_preflight.stderr }}
            dest: "{{ tier2_sandbox }}/preflight-failure.log"
            mode: "0600"
          changed_when: false

        - name: Collect the output of the child play
          ansible.builtin.set_fact:
            tier2c_preflight_output: >-
              {{ (tier2c_preflight.stdout | default(''))
                 ~ (tier2c_preflight.stderr | default('')) }}

        - name: Assert the preflight aborted on the missing snapshot
          ansible.builtin.assert:
            that:
              - tier2c_preflight.rc != 0
              - "'was not found under' in tier2c_preflight_output"
            fail_msg: >-
              The preflight did not abort on the missing snapshot (rc={{ tier2c_preflight.rc }}).
              Full child output is in {{ tier2_sandbox }}/preflight-failure.log. Last output:
              {{ tier2c_preflight_output | default('') | trim | split('\n') | last }}
            success_msg: "Preflight aborted on the missing snapshot, as designed"

        - name: Inspect the temporary top-level mount left by the failed preflight
          ansible.builtin.command:
            cmd: "findmnt --noheadings --mountpoint {{ tier2b_top_mount_point }}"
          register: tier2c_leftover
          changed_when: false
          failed_when: false

        - name: Inspect the mount point left by the failed preflight
          # The contract is that the mount is released, not that the directory
          # is deleted: mount_btrfs_top.yml creates it and only umount(8) runs
          # afterwards. A mount that was still in place would expose the BtrFS
          # content here, so an empty directory is the real proof.
          ansible.builtin.find:
            paths: "{{ tier2b_top_mount_point }}"
            recurse: false
          register: tier2c_mount_point
          failed_when: false

        - name: Assert the failed preflight left no mount behind
          ansible.builtin.assert:
            that:
              - tier2c_leftover.rc != 0
              - tier2c_mount_point.matched | default(0) == 0
            fail_msg: >-
              The failed preflight left the ephemeral top-level mount in place:
              {{ tier2c_leftover.stdout | default('') }}
            success_msg: >-
              Failed preflight released its ephemeral top-level mount and left
              the mount point empty

      always:
        - name: Release the layout under test before the next block
          ansible.builtin.shell: |
            set -uo pipefail
            while findmnt --mountpoint {{ tier2b_mount }} >/dev/null 2>&1; do
              umount -R {{ tier2b_mount }} 2>/dev/null || umount -lR {{ tier2b_mount }} 2>/dev/null || break
            done
          args:
            executable: /bin/bash
          changed_when: false
          failed_when: false

    # The fixture marks @ and @home read-only by hand, which is not what
    # Timeshift does: it creates read-write snapshots. This block replays that
    # exact state and requires the run to stream from a read-only copy-on-write
    # copy while leaving the real snapshot read-write and untouched.
    - name: Copy a read-write Timeshift snapshot without mutating it
      when: tier2_uid.stdout | trim == '0'
      tags:
        - molecule-idempotence-notest
      block:
        - name: Mount the layout under test at the top-level
          # Explicit subvolid=5: the fixture made @root the filesystem default,
          # so a plain mount would expose @root and hide the timeshift-btrfs tree
          # that lives in the top-level next to it, exactly like subvol=/@ does.
          ansible.builtin.command:  # noqa command-instead-of-module
            cmd: "mount --types btrfs --options subvolid=5,loop {{ tier2b_image }} {{ tier2b_mount }}"
          changed_when: false

        - name: Make the snapshot look like a real Timeshift snapshot
          ansible.builtin.command:
            cmd: "btrfs property set -t subvol {{ tier2b_snapshot_dir }}/{{ item }} ro false"
          loop:
            - "@"
            - "@home"
          changed_when: false

        - name: Run the snapshot role against the read-write snapshot
          ansible.builtin.include_role:
            name: snapshot
          vars:
            snapshot: "{{ tier2b_snapshot_name }}"
            # Both overrides are mandatory here: timeshift_device is a fact set
            # by the first block and snapshot_top_mount_point a play var, so
            # without them the role would resolve this snapshot through the
            # first block's filesystem and report it as missing.
            timeshift_device: "{{ tier2b_loop.stdout | trim }}"
            snapshot_top_mount_point: "{{ tier2b_top_mount_point }}"
            # tier2b_mount is this layout mounted read-write, so the copy is
            # taken on the same BTRFS filesystem without an extra mount.
            snapshot_stage_root: "{{ tier2b_mount }}/stage"
            snapshot_stage_min_free_bytes: "1M"

        - name: Read the read-only property of the real snapshot subvolumes
          ansible.builtin.command:
            cmd: "btrfs property get -t subvol {{ tier2b_snapshot_dir }}/{{ item }} ro"
          loop:
            - "@"
            - "@home"
          register: tier2d_ro
          changed_when: false

        - name: Read the read-only property of the staged copy
          ansible.builtin.command:
            cmd: "btrfs property get -t subvol {{ snapshot_stage_dir }}/{{ item }} ro"
          loop:
            - "@"
            - "@home"
          register: tier2d_stage_ro
          changed_when: false

        - name: Assert the real snapshot was left read-write (never mutated)
          ansible.builtin.assert:
            that:
              - item.stdout | trim == 'ro=false'
            fail_msg: >-
              The run mutated the real snapshot: {{ item.item }} is now
              '{{ item.stdout | trim }}'. The pipeline must only read it.
            success_msg: "{{ item.item }} left untouched (ro=false)"
          loop: "{{ tier2d_ro.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Assert the run streams from a read-only copy of that snapshot
          ansible.builtin.assert:
            that:
              - snapshot_staged | bool
              - snapshot_source_root == tier2b_snapshot_dir + '/@'
              - snapshot_root == tier2b_mount + '/stage/timeshift-btrfs/snapshots/' + tier2b_snapshot_name + '/@'
              - snapshot_home == tier2b_mount + '/stage/timeshift-btrfs/snapshots/' + tier2b_snapshot_name + '/@home'
              - item.stdout | trim == 'ro=true'
            fail_msg: >-
              The run did not stream from a read-only copy:
              staged={{ snapshot_staged | default(false) }} root={{ snapshot_root }}
            success_msg: "Streams from the read-only copy; real snapshot untouched"
          loop: "{{ tier2d_stage_ro.results }}"
          loop_control:
            label: "{{ item.item }}"

      always:
        - name: Release the layout under test before the next block
          ansible.builtin.shell: |
            set -uo pipefail
            for mount_point in {{ tier2b_top_mount_point }} {{ tier2b_mount }}; do
              while findmnt --mountpoint "$mount_point" >/dev/null 2>&1; do
                umount -R "$mount_point" 2>/dev/null || umount -lR "$mount_point" 2>/dev/null || break
              done
            done
          args:
            executable: /bin/bash
          changed_when: false
          failed_when: false

    - name: Exercise the disk role with atomic swap and ephemeral mounts
      when: tier2_uid.stdout | trim == '0'
      tags:
        - molecule-idempotence-notest
      block:
        - name: Hash the host fstab before disk operations
          ansible.builtin.command:
            cmd: sha256sum /etc/fstab
          register: tier2_fstab_before
          changed_when: false

        - name: Run the disk role
          ansible.builtin.include_role:
            name: disk

        - name: Assert disk role published required facts
          ansible.builtin.assert:
            that:
              - nbd_device is defined
              - nbd_device | length > 0
              - vm_efi_uuid is defined
              - vm_efi_uuid | length > 0
              - vm_btrfs_uuid is defined
              - vm_btrfs_uuid | length > 0
              - vm_mount_root is defined
              - vm_mount_root | length > 0
              - vm_mount_efi is defined
              - vm_mount_efi | length > 0
            fail_msg: "Disk role did not publish required facts"

        - name: Assert the disk file exists and is valid qcow2
          ansible.builtin.command:
            cmd: qemu-img info -U {{ vm_disk }}
          register: tier2_disk_info
          changed_when: false

        - name: Assert qcow2 format
          ansible.builtin.assert:
            that:
              - "'file format: qcow2' in tier2_disk_info.stdout"
            fail_msg: "VM disk is not qcow2 format"

        - name: Assert ephemeral mounts exist
          ansible.builtin.command:
            cmd: findmnt --mountpoint {{ vm_mount_root }} --noheadings
          register: tier2_root_mount
          changed_when: false

        - name: Assert root is mounted
          ansible.builtin.assert:
            that:
              - tier2_root_mount.rc == 0
            fail_msg: "BTRFS root is not mounted at {{ vm_mount_root }}"

        - name: Assert EFI is mounted
          ansible.builtin.command:
            cmd: findmnt --mountpoint {{ vm_mount_efi }} --noheadings
          register: tier2_efi_mount
          changed_when: false

        - name: Assert EFI mount succeeded
          ansible.builtin.assert:
            that:
              - tier2_efi_mount.rc == 0
            fail_msg: "EFI is not mounted at {{ vm_mount_efi }}"

        - name: Hash the host fstab after disk operations
          ansible.builtin.command:
            cmd: sha256sum /etc/fstab
          register: tier2_fstab_after
          changed_when: false

        - name: Assert host fstab was not modified
          ansible.builtin.assert:
            that:
              - tier2_fstab_before.stdout == tier2_fstab_after.stdout
            fail_msg: "Host /etc/fstab was modified by disk operations"
            success_msg: "Host /etc/fstab remains intact"

    - name: Exercise the restore role with snapshot subvolumes
      when: tier2_uid.stdout | trim == '0'
      tags:
        - molecule-idempotence-notest
      block:
        # The staging block published snapshot_root/snapshot_home pointing at the
        # read-only copy it left under tier2b_mount/stage, and its `always`
        # released that mount. Production keeps the top-level mounted across
        # snapshot and restore, so restore it here; explicit subvolid=5 because
        # the fixture made @root the filesystem default and a plain mount would
        # hide the timeshift-btrfs tree the copy lives in.
        - name: Remount the layout holding the snapshot to restore
          ansible.builtin.command:  # noqa command-instead-of-module
            cmd: "mount --types btrfs --options subvolid=5,loop {{ tier2b_image }} {{ tier2b_mount }}"
          changed_when: false

        - name: Inspect the remounted snapshot layout
          ansible.builtin.command:
            cmd: "findmnt --noheadings --mountpoint {{ tier2b_mount }}"
          register: tier2e_source_mount
          changed_when: false

        - name: Assert the snapshot layout is mounted
          ansible.builtin.assert:
            that:
              - tier2e_source_mount.rc == 0
            fail_msg: >-
              Could not reach the snapshot to restore: {{ tier2b_mount }} is not
              mounted, so btrfs send cannot resolve {{ snapshot_root | default('snapshot_root') }}.

        - name: Run the restore role
          ansible.builtin.include_role:
            name: restore

        - name: Assert restore role mounted the restored root
          ansible.builtin.command:
            cmd: findmnt --mountpoint {{ vm_mount_root }}-root --noheadings
          register: tier2_restore_root_mount
          changed_when: false

        - name: Assert restored root is mounted
          ansible.builtin.assert:
            that:
              - tier2_restore_root_mount.rc == 0
            fail_msg: "Restored root is not mounted at {{ vm_mount_root }}-root"

        - name: Assert restore role mounted the restored home
          ansible.builtin.command:
            cmd: findmnt --mountpoint {{ vm_mount_root }}-root/home --noheadings
          register: tier2_restore_home_mount
          changed_when: false

        - name: Assert restored home is mounted
          ansible.builtin.assert:
            that:
              - tier2_restore_home_mount.rc == 0
            fail_msg: "Restored home is not mounted at {{ vm_mount_root }}-root/home"

        - name: Assert restore role mounted EFI into restored system
          ansible.builtin.command:
            cmd: findmnt --mountpoint {{ vm_mount_root }}-root/boot --noheadings
          register: tier2_restore_efi_mount
          changed_when: false

        - name: Assert restored EFI is mounted
          ansible.builtin.assert:
            that:
              - tier2_restore_efi_mount.rc == 0
            fail_msg: "Restored EFI is not mounted at {{ vm_mount_root }}-root/boot"

        - name: Assert VM fstab was installed
          ansible.builtin.stat:
            path: "{{ vm_mount_root }}-root/etc/fstab"
          register: tier2_fstab_file

        - name: Assert fstab exists and contains BTRFS entries
          ansible.builtin.assert:
            that:
              - tier2_fstab_file.stat.exists
            fail_msg: "VM fstab was not installed"

        - name: Read the installed fstab
          ansible.builtin.slurp:
            src: "{{ vm_mount_root }}-root/etc/fstab"
          register: tier2_installed_fstab

        - name: Assert fstab contains correct UUID references
          ansible.builtin.assert:
            that:
              - vm_btrfs_uuid in (tier2_installed_fstab.content | b64decode)
              - vm_efi_uuid in (tier2_installed_fstab.content | b64decode)
              - "'subvol=/@' in (tier2_installed_fstab.content | b64decode)"
              - "'subvol=/@home' in (tier2_installed_fstab.content | b64decode)"
            fail_msg: "VM fstab does not contain correct UUID references"

        - name: Read the cloned machine-id
          ansible.builtin.slurp:
            src: "{{ vm_mount_root }}-root/etc/machine-id"
          register: tier2_machine_id

        - name: Read the cloned hostname
          ansible.builtin.slurp:
            src: "{{ vm_mount_root }}-root/etc/hostname"
          register: tier2_hostname

        - name: Assert the clone identity was reset
          ansible.builtin.assert:
            that:
              - tier2_machine_id.content | b64decode | trim == ''
              - tier2_hostname.content | b64decode | trim == vm_name
            fail_msg: "Clone identity was not reset (machine-id/hostname)"

    - name: Exercise the boot role with chroot and GRUB installation
      when: tier2_uid.stdout | trim == '0'
      tags:
        - molecule-idempotence-notest
      block:
        - name: Run the boot role
          ansible.builtin.include_role:
            name: boot

        - name: Assert the boot role prepared the chroot
          ansible.builtin.assert:
            that:
              - boot_chroot_prepared | default(false) | bool
            fail_msg: "Boot role did not prepare the chroot"

    - name: Exercise the libvirt role with define and undefine
      when: tier2_uid.stdout | trim == '0'
      tags:
        - molecule-idempotence-notest
      block:
        - name: Hash the host fstab before libvirt operations
          ansible.builtin.command:
            cmd: sha256sum /etc/fstab
          register: tier2_fstab_pre_libvirt
          changed_when: false

        - name: Run the libvirt role
          ansible.builtin.include_role:
            name: libvirt

        - name: Read the generated domain XML
          ansible.builtin.slurp:
            src: "{{ work_dir }}/{{ vm_name }}.xml"
          register: tier2_domain_xml

        - name: Assert the XML was generated
          ansible.builtin.assert:
            that:
              - tier2_domain_xml.content | b64decode | length > 0
            fail_msg: "Libvirt domain XML was not generated"

        - name: Assert the XML contains the VM name
          ansible.builtin.assert:
            that:
              - vm_name in (tier2_domain_xml.content | b64decode)
              - vm_disk in (tier2_domain_xml.content | b64decode)
              - "'cdrom' not in (tier2_domain_xml.content | b64decode)"
            fail_msg: "Libvirt domain XML does not contain expected content"

        - name: Run teardown (undefine the domain)
          ansible.builtin.include_tasks:
            file: "{{ project_dir }}/roles/libvirt/tasks/teardown.yml"

        - name: Assert the domain was undefined
          ansible.builtin.command:
            cmd: virsh dominfo {{ vm_name }}
          register: tier2_undefine_check
          failed_when: tier2_undefine_check.rc == 0
          changed_when: false

        - name: Hash the host fstab after libvirt operations
          ansible.builtin.command:
            cmd: sha256sum /etc/fstab
          register: tier2_fstab_post_libvirt
          changed_when: false

        - name: Assert host fstab was not modified by libvirt
          ansible.builtin.assert:
            that:
              - tier2_fstab_pre_libvirt.stdout == tier2_fstab_post_libvirt.stdout
            fail_msg: "Host /etc/fstab was modified by libvirt operations"
            success_msg: "Host /etc/fstab remains intact after libvirt"
      always:
        - name: Aggressive cleanup of all tier2 mounts and NBD devices
          ansible.builtin.shell: |
            set -uo pipefail
            # Unmount all tier2 mounts recursively (nested -> outer)
            for mp in {{ work_dir }}/mnt-root {{ work_dir }}/mnt {{ tier2_mount }} \
                      {{ tier2b_mount }} {{ tier2b_top_mount_point }}; do
              while findmnt --mountpoint "$mp" >/dev/null 2>&1; do
                umount -R "$mp" 2>/dev/null || umount -lR "$mp" 2>/dev/null || break
              done
            done
            # Disconnect the tracked NBD device, if any
            if [ -n "{{ nbd_device | default('') }}" ] && [ -b "{{ nbd_device | default('/dev/null') }}" ]; then
              qemu-nbd --disconnect "{{ nbd_device | default('') }}" >/dev/null 2>&1 || true
            fi
            # Disconnect any other NBD device that still serves the sandbox
            for nbd in /dev/nbd*; do
              [ -b "$nbd" ] || continue
              pid_file="/sys/block/$(basename "$nbd")/pid"
              [ -r "$pid_file" ] || continue
              pid="$(cat "$pid_file" 2>/dev/null || true)"
              [ -n "$pid" ] || continue
              if tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null | grep -q "{{ tier2_sandbox }}"; then
                qemu-nbd --disconnect "$nbd" >/dev/null 2>&1 || true
              fi
            done
            # Detach loop devices left behind by an aborted block
            losetup -j "{{ tier2_sandbox }}" | cut -d: -f1 | while read -r loop; do
              losetup --detach "$loop" 2>/dev/null || true
            done
            rm -rf {{ tier2_sandbox }}
          args:
            executable: /bin/bash
          changed_when: false
          failed_when: false
