---
# Tier 2 - privileged tests against a local sandbox (NBD, BTRFS, mkfs, virsh).
# Runs on the current host through the delegated (default) driver.
dependency:
  name: galaxy
  options:
    role-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml
driver:
  name: default
  options:
    managed: false
    login_cmd_template: bash -l
platforms:
  - name: localhost
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  inventory:
    host_vars:
      localhost:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
verifier:
  name: ansible
scenario:
  # The delegated, unmanaged driver creates no resources, so create/prepare/
  # side_effect have no playbooks. cleanup purges the sandbox and any loop/NBD
  # residue from this run, including when converge aborts.
  test_sequence:
    - dependency
    - syntax
    - converge
    - idempotence
    - verify
    - cleanup
