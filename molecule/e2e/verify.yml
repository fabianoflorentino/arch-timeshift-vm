---
- name: Verify - Tier 3 VM boot
  hosts: all
  become: true
  gather_facts: false

  vars:
    e2e_work_dir: "{{ lookup('env', 'E2E_WORK_DIR') | default('/var/tmp/arch-timeshift-vm-e2e/work', true) }}"
    e2e_vm_name: "{{ lookup('env', 'E2E_VM_NAME') | default('arch-timeshift-e2e', true) }}"
    libvirt_uri: qemu:///system
    e2e_guest_evidence_marker: /etc/arch-timeshift-vm/e2e-boot-ok
    e2e_guest_evidence_signature: ARCH_TIMESHIFT_VM_E2E_HEALTHY
    e2e_guest_agent_channel: org.qemu.guest_agent.0
    e2e_guest_agent_ping_retries: 30

  tasks:
    - name: Load the generated E2E contract
      ansible.builtin.include_vars:
        file: "{{ e2e_work_dir }}/e2e-vars.yml"

    - name: Wait for the VM to reach running state
      ansible.builtin.command:
        cmd: virsh -c {{ libvirt_uri }} domstate {{ e2e_vm_name }}
      register: e2e_domain_state
      changed_when: false
      retries: 12
      delay: 5
      until: e2e_domain_state.rc == 0 and (e2e_domain_state.stdout | trim) == 'running'

    - name: Assert the VM is running
      ansible.builtin.assert:
        that:
          - e2e_domain_state.stdout | trim == 'running'
        fail_msg: "E2E domain {{ e2e_vm_name }} did not reach running state"
        quiet: true

    - name: Inspect the running domain
      ansible.builtin.command:
        cmd: virsh -c {{ libvirt_uri }} domblklist {{ e2e_vm_name }} --details
      register: e2e_block_devices
      changed_when: false

    - name: Assert the restored disk is attached
      ansible.builtin.assert:
        that:
          - vm_disk in e2e_block_devices.stdout
        fail_msg: "E2E domain is running without the restored disk {{ vm_disk }}"
        quiet: true

    - name: Ping the QEMU guest agent over the virtio-serial channel
      ansible.builtin.command:
        cmd: >-
          virsh -c {{ libvirt_uri }} qemu-agent-command {{ e2e_vm_name }}
          --timeout 10 '{"execute":"guest-ping"}'
      register: e2e_guest_agent
      changed_when: false
      failed_when: false
      retries: "{{ e2e_guest_agent_ping_retries if (e2e_guest_agent_available | bool) else 1 }}"
      delay: 5
      until: e2e_guest_agent.rc == 0

    - name: Assert the guest agent answered when the snapshot supports it
      ansible.builtin.assert:
        that:
          - not (e2e_guest_agent_available | bool) or (e2e_guest_agent.rc | int == 0)
        fail_msg: >-
          The restored clone supports the QEMU guest agent (qemu-ga was found
          and wired during boot), but the agent did not answer guest-ping over
          the {{ e2e_guest_agent_channel }} channel while the domain was
          running. stdout: {{ e2e_guest_agent.stdout | default('') }} stderr:
          {{ e2e_guest_agent.stderr | default('') }}
        quiet: true

    - name: Stop the VM before inspecting guest evidence
      ansible.builtin.command:
        cmd: virsh -c {{ libvirt_uri }} shutdown {{ e2e_vm_name }}
      register: e2e_shutdown
      changed_when: false
      failed_when: false

    - name: Wait for the VM to stop cleanly
      ansible.builtin.command:
        cmd: virsh -c {{ libvirt_uri }} domstate {{ e2e_vm_name }}
      register: e2e_shutdown_state
      changed_when: false
      retries: 12
      delay: 5
      failed_when: false
      until:
        - e2e_shutdown_state.rc == 0
        - e2e_shutdown_state.stdout | trim == 'shut off'

    - name: Force-stop the VM when graceful shutdown did not complete
      ansible.builtin.command:
        cmd: virsh -c {{ libvirt_uri }} destroy {{ e2e_vm_name }}
      when: e2e_shutdown_state.stdout | trim != 'shut off'
      changed_when: true

    - name: Wait for the VM to be fully stopped
      ansible.builtin.command:
        cmd: virsh -c {{ libvirt_uri }} domstate {{ e2e_vm_name }}
      register: e2e_forced_shutdown_state
      changed_when: false
      retries: 6
      delay: 2
      until:
        - e2e_forced_shutdown_state.rc == 0
        - e2e_forced_shutdown_state.stdout | trim == 'shut off'

    - name: Connect the E2E disk read-only for guest evidence
      block:
        - name: Load NBD support
          ansible.builtin.command:
            cmd: modprobe nbd max_part=16
          changed_when: false

        - name: Find a free NBD device
          ansible.builtin.shell: |
            set -euo pipefail
            for nbd in /dev/nbd{0..15}; do
              if [ -b "$nbd" ] &&
                 [ "$(cat "/sys/class/block/${nbd##*/}/size" 2>/dev/null || echo 1)" = "0" ]; then
                echo "$nbd"
                exit 0
              fi
            done
            echo "No free NBD device found in /dev/nbd0 through /dev/nbd15" >&2
            exit 1
          args:
            executable: /bin/bash
          register: e2e_evidence_nbd_find
          changed_when: false

        - name: Store the evidence NBD device
          ansible.builtin.set_fact:
            e2e_evidence_nbd: "{{ e2e_evidence_nbd_find.stdout | trim }}"

        - name: Connect the disk read-only
          ansible.builtin.command:
            cmd: qemu-nbd --read-only --connect={{ e2e_evidence_nbd }} {{ vm_disk }}
          changed_when: true

        - name: Wait for the restored root partition
          ansible.builtin.wait_for:
            path: "{{ e2e_evidence_nbd }}p2"
            state: present
            timeout: 15

        - name: Inform the kernel of the partition table
          ansible.builtin.command:
            cmd: partprobe {{ e2e_evidence_nbd }}
          changed_when: false

        - name: Create the guest evidence mountpoint
          ansible.builtin.file:
            path: "{{ e2e_work_dir }}/guest-evidence"
            state: directory
            mode: "0755"

        - name: Mount the restored root read-only
          ansible.builtin.command:  # noqa command-instead-of-module
            cmd: >-
              mount -t btrfs -o ro,subvol=@
              {{ e2e_evidence_nbd }}p2 {{ e2e_work_dir }}/guest-evidence
          changed_when: true

        - name: Read the guest health evidence marker
          ansible.builtin.slurp:
            src: "{{ e2e_work_dir }}/guest-evidence{{ e2e_guest_evidence_marker }}"
          register: e2e_guest_evidence
          failed_when: false

        - name: Assert the guest reported healthy boot evidence
          ansible.builtin.assert:
            that:
              - e2e_guest_evidence.failed | default(false) | bool == false
              - e2e_guest_evidence.content | default('') | b64decode | trim == e2e_guest_evidence_signature
            fail_msg: >-
              The VM stopped, but the expected guest health marker was not
              written with the expected signature. Service:
              {{ (e2e_work_dir + '/guest-evidence/etc/systemd/system/'
                  'arch-timeshift-vm-e2e-evidence.service') }}.
            quiet: true
      always:
        - name: Unmount the guest evidence filesystem
          ansible.builtin.command:
            cmd: umount {{ e2e_work_dir }}/guest-evidence
          changed_when: false
          failed_when: false

        - name: Disconnect the evidence NBD device
          ansible.builtin.command:
            cmd: qemu-nbd --disconnect {{ e2e_evidence_nbd | default('') }}
          changed_when: false
          failed_when: false

        - name: Remove the guest evidence mountpoint
          ansible.builtin.file:
            path: "{{ e2e_work_dir }}/guest-evidence"
            state: absent
