---
- name: Verify - Tier 3 VM boot
  hosts: all
  become: true
  gather_facts: false

  vars:
    e2e_work_dir: "{{ lookup('env', 'E2E_WORK_DIR') | default('/var/tmp/arch-timeshift-vm-e2e/work', true) }}"
    e2e_vm_name: "{{ lookup('env', 'E2E_VM_NAME') | default('arch-timeshift-e2e', true) }}"
    libvirt_uri: qemu:///system

  tasks:
    - name: Load the generated E2E contract
      ansible.builtin.include_vars:
        file: "{{ e2e_work_dir }}/e2e-vars.yml"

    - name: Wait for the VM to reach running state
      ansible.builtin.command:
        cmd: virsh -c {{ libvirt_uri }} domstate {{ e2e_vm_name }}
      register: e2e_domain_state
      changed_when: false
      retries: 12
      delay: 5
      until: e2e_domain_state.rc == 0 and (e2e_domain_state.stdout | trim) == 'running'

    - name: Assert the VM is running
      ansible.builtin.assert:
        that:
          - e2e_domain_state.stdout | trim == 'running'
        fail_msg: "E2E domain {{ e2e_vm_name }} did not reach running state"
        quiet: true

    - name: Inspect the running domain
      ansible.builtin.command:
        cmd: virsh -c {{ libvirt_uri }} domblklist {{ e2e_vm_name }} --details
      register: e2e_block_devices
      changed_when: false

    - name: Assert the restored disk is attached
      ansible.builtin.assert:
        that:
          - vm_disk in e2e_block_devices.stdout
        fail_msg: "E2E domain is running without the restored disk {{ vm_disk }}"
        quiet: true

    - name: Read the guest serial console for health evidence
      ansible.builtin.shell: |
        set +e
        timeout 20s virsh -c "{{ libvirt_uri }}" console "{{ e2e_vm_name }}" --force
        exit 0
      args:
        executable: /bin/bash
      register: e2e_guest_console
      changed_when: false
      retries: 6
      delay: 5
      until: "'ARCH_TIMESHIFT_VM_E2E_HEALTHY' in e2e_guest_console.stdout"

    - name: Assert the guest reported healthy boot evidence
      ansible.builtin.assert:
        that:
          - "'ARCH_TIMESHIFT_VM_E2E_HEALTHY' in e2e_guest_console.stdout"
        fail_msg: >-
          The VM reached running state, but the guest did not report the
          expected boot-health signature on its serial console.
        quiet: true
