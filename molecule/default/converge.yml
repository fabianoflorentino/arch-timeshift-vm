---
- name: Converge - Tier 1 snapshot preflight
  hosts: all
  become: false
  gather_facts: true

  vars:
    fixture_root: /tmp/arch-timeshift-vm-fixtures
    fixture_snapshots: "{{ fixture_root }}/snapshots"
    fixture_images: "{{ fixture_root }}/images"
    fixture_snapshot: "2020-01-02_03-04-05"
    fixture_snapshot_dir: "{{ fixture_snapshots }}/{{ fixture_snapshot }}"
    # Sorts before fixture_snapshot, so `snapshot=latest` keeps resolving to the
    # healthy fixture and only an explicit request reaches this one.
    fixture_bad_snapshot: "2019-12-25_00-00-00"
    fixture_bad_snapshot_dir: "{{ fixture_snapshots }}/{{ fixture_bad_snapshot }}"

    # Base variables for the role under test. Individual negative cases below
    # override a single value to prove a guard fires.
    confirm_restore: true
    vm_name: tier1-test
    timeshift_root: "{{ fixture_snapshots }}"
    snapshot: latest
    vm_images_dir: "{{ fixture_images }}"
    vm_disk: "{{ fixture_images }}/vm.qcow2"
    vm_disk_size: 10M
    snapshot_required_commands: []

  tasks:
    - name: Assert the managed node is Arch Linux
      ansible.builtin.assert:
        that:
          - ansible_facts["os_family"] == "Archlinux"
          - ansible_facts["distribution"] == "Archlinux"
        fail_msg: "Tier 1 container is not Arch Linux (family={{ ansible_facts['os_family'] }})"
        success_msg: "Tier 1 container is Arch Linux {{ ansible_facts['distribution_version'] }}"

    - name: Ensure the harness directory exists
      ansible.builtin.file:
        path: /etc/arch-timeshift-vm
        state: directory
        mode: "0755"

    - name: Create the harness marker
      ansible.builtin.copy:
        content: "tier1-ok\n"
        dest: /etc/arch-timeshift-vm/tier1-ok
        mode: "0644"

    - name: Create the fixture tree
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ fixture_root }}"
        - "{{ fixture_snapshots }}"
        - "{{ fixture_images }}"
        - "{{ fixture_snapshot_dir }}"
        - "{{ fixture_snapshot_dir }}/@"
        - "{{ fixture_snapshot_dir }}/@home"
        - "{{ fixture_snapshot_dir }}/@/etc"
        - "{{ fixture_snapshot_dir }}/@/usr/bin"
        - "{{ fixture_snapshot_dir }}/@/usr/lib/modules/fixture"

    # Mirrors what Timeshift 26.09.0 actually writes: `created` is an epoch
    # string and origin is `sys-uuid`/`sys-distro`. There is no `hostname` key.
    - name: Write the fixture snapshot metadata
      ansible.builtin.copy:
        content: |
          {
            "created": "1577934245",
            "sys-uuid": "11111111-2222-3333-4444-555555555555",
            "sys-distro": "Arch rolling",
            "app-version": "26.09.0",
            "file_count": "0",
            "tags": "daily",
            "comments": "",
            "live": "false",
            "type": "btrfs",
            "subvolumes": {"@": [], "@home": []}
          }
        dest: "{{ fixture_snapshot_dir }}/info.json"
        mode: "0644"

    - name: Write the fixture hostname of the recorded origin
      ansible.builtin.copy:
        content: "tier1-host\n"
        dest: "{{ fixture_snapshot_dir }}/@/etc/hostname"
        mode: "0644"

    - name: Write the fixture hostname inside the snapshot tree
      ansible.builtin.copy:
        content: "tier1-host\n"
        dest: "{{ fixture_snapshot_dir }}/@/etc/hostname"
        mode: "0644"

    - name: Write the fixture boot markers
      ansible.builtin.copy:
        content: "fixture\n"
        dest: "{{ item }}"
        mode: "0755"
      loop:
        - "{{ fixture_snapshot_dir }}/@/etc/fstab"
        - "{{ fixture_snapshot_dir }}/@/usr/bin/grub-install"
        - "{{ fixture_snapshot_dir }}/@/usr/bin/mkinitcpio"
        - "{{ fixture_snapshot_dir }}/@/usr/lib/modules/fixture/vmlinuz"

    # A structurally valid BTRFS snapshot that never declares which machine it
    # came from: Timeshift's sys-uuid is absent, so the origin is unknown.
    - name: Create the fixture tree of an origin-less snapshot
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ fixture_bad_snapshot_dir }}"
        - "{{ fixture_bad_snapshot_dir }}/@/"
        - "{{ fixture_bad_snapshot_dir }}/@home"

    - name: Write the metadata of the origin-less snapshot
      ansible.builtin.copy:
        content: |
          {
            "created": "1577232000",
            "sys-distro": "Arch rolling",
            "type": "btrfs",
            "subvolumes": {"@": [], "@home": []}
          }
        dest: "{{ fixture_bad_snapshot_dir }}/info.json"
        mode: "0644"

    - name: Positive - snapshot_source resolves and validates a bootable fixture
      block:
        - name: Run the snapshot_source role
          ansible.builtin.include_role:
            name: snapshot_source
          vars:
            snapshot_source_root: "{{ fixture_snapshots }}"
            snapshot_source_name: latest
            snapshot_source_validate_btrfs: false
            snapshot_source_require_boot_artifacts: true

        - name: Assert the snapshot_source contract
          ansible.builtin.assert:
            that:
              - e2e_snapshot_name == fixture_snapshot
              - e2e_snapshot_dir == fixture_snapshot_dir
              - e2e_snapshot_capabilities.has_kernel | bool
              - e2e_snapshot_capabilities.has_grub_install | bool
              - e2e_snapshot_capabilities.has_mkinitcpio | bool
              - e2e_snapshot_capabilities.bootable_candidate | bool
            fail_msg: "snapshot_source did not publish the expected contract"

    - name: Negative - snapshot creation requires explicit confirmation
      block:
        - name: Run snapshot_source without creation confirmation
          ansible.builtin.include_role:
            name: snapshot_source
          vars:
            snapshot_source_create: true
            snapshot_source_create_confirm: false

        - name: Record a failed snapshot creation guard
          ansible.builtin.set_fact:
            tier1_snapshot_source_create_guard: false
      rescue:
        - name: Record a successful snapshot creation guard
          ansible.builtin.set_fact:
            tier1_snapshot_source_create_guard: true

    - name: Assert snapshot creation guard passed
      ansible.builtin.assert:
        that:
          - tier1_snapshot_source_create_guard | bool
        fail_msg: "snapshot_source allowed unconfirmed snapshot creation"

    - name: Positive - E2E preflight publishes host capability facts
      block:
        - name: Run E2E preflight with host-dependent checks disabled
          ansible.builtin.include_role:
            name: e2e_preflight
          vars:
            e2e_preflight_required_commands: []
            e2e_preflight_require_kvm: false
            e2e_preflight_require_libvirt_network: false
            e2e_preflight_require_ovmf: false
            e2e_preflight_images_dir: "{{ fixture_root }}"
            e2e_preflight_min_free_bytes: 0

        - name: Assert the E2E preflight contract
          ansible.builtin.assert:
            that:
              - e2e_host_capabilities.kvm is false
              - e2e_host_capabilities.libvirt_network is false
              - e2e_host_capabilities.ovmf is false
              - e2e_host_capabilities.free_bytes | int >= 0
            fail_msg: "E2E preflight did not publish the expected contract"

    - name: Positive - the snapshot role resolves and validates the fixture
      block:
        - name: Run the snapshot role
          ansible.builtin.include_role:
            name: snapshot

        - name: Assert the resolved preflight contract
          ansible.builtin.assert:
            that:
              - resolved_snapshot == fixture_snapshot
              - snapshot_root == fixture_snapshot_dir + '/@'
              - snapshot_home == fixture_snapshot_dir + '/@home'
              - vm_images_dir_real == fixture_images
              - vm_disk_real == fixture_images + '/vm.qcow2'
            fail_msg: "Snapshot role resolved an unexpected preflight contract"

    - name: Unit - the top-level mount selector picks fsroot "/" for the device
      block:
        - name: Seed a synthetic findmnt result
          ansible.builtin.set_fact:
            snapshot_device: /dev/nvme1n1p2
            snapshot_btrfs_mounts:
              stdout_lines:
                - "/dev/nvme1n1p2[/@] / /@"
                - "/dev/nvme1n1p2[/@home] /home /@home"
                - "/dev/nvme1n1p2 /mnt/btrfs-top /"
                - "/dev/loop9 /somewhere /"

        - name: Run the top-level mount selector
          ansible.builtin.include_tasks: >-
            {{ playbook_dir }}/../../roles/snapshot/tasks/select_btrfs_top_mount.yml

        - name: Assert the selector picked the top-level mount
          ansible.builtin.assert:
            that:
              - snapshot_top_mount == '/mnt/btrfs-top'
              - not (snapshot_top_mount_temporary | bool)
            fail_msg: "Mount selector returned '{{ snapshot_top_mount }}'"

    - name: Unit - the device is derived without the findmnt subvolume suffix
      block:
        # Regression: '\[.*\]$' inside single-quoted YAML is a literal
        # backslash in the regex, so the [/@] suffix survived and mount(8) was
        # handed a device that does not exist. findmnt appends the suffix on
        # every real host with subvol=@.
        - name: Derive the device from a realistic findmnt source
          ansible.builtin.set_fact:
            tier1_derived_device: >-
              {{ '/dev/nvme0n1p2[/@]' | trim | regex_replace('\[[^]]*\]$', '') }}

        - name: Assert the subvolume suffix was stripped
          ansible.builtin.assert:
            that:
              - tier1_derived_device == '/dev/nvme0n1p2'
            fail_msg: >-
              Derived device is '{{ tier1_derived_device }}'; mount(8) would
              reject it. The [/@] suffix must be stripped.

    - name: Negative - the selector aborts when auto-mount is disabled and no
        top-level mount exists
      block:
        - name: Seed findmnt output without a top-level mount for the device
          ansible.builtin.set_fact:
            snapshot_device: /dev/loop9
            snapshot_btrfs_mounts:
              stdout_lines:
                - "/dev/nvme1n1p2 / /@"

        - name: Run the top-level mount selector without the auto-mount fallback
          ansible.builtin.include_tasks: >-
            {{ playbook_dir }}/../../roles/snapshot/tasks/select_btrfs_top_mount.yml
          vars:
            timeshift_autodetect_mount_top: false

        - name: Assert the selector reports no matching top-level
          ansible.builtin.assert:
            that:
              - snapshot_top_mount | length == 0
            fail_msg: "Mount selector should return empty when no top-level is mounted"

    - name: Negative - the auto-mount fallback fails loudly on an unmountable device
      block:
        - name: Seed findmnt output without a top-level mount for the device
          ansible.builtin.set_fact:
            snapshot_device: /dev/loop9
            snapshot_btrfs_mounts:
              stdout_lines:
                - "/dev/nvme1n1p2 / /@"

        - name: Run the top-level mount selector with the auto-mount fallback
          ansible.builtin.include_tasks: >-
            {{ playbook_dir }}/../../roles/snapshot/tasks/select_btrfs_top_mount.yml
          vars:
            snapshot_top_mount_point: "{{ fixture_root }}/auto-top"
            snapshot_required_commands:
              - blkid
              - mount
              - umount

        - name: Record a failed auto-mount guard
          ansible.builtin.set_fact:
            tier1_automount_guard: false
      rescue:
        - name: Record a successful auto-mount guard
          ansible.builtin.set_fact:
            tier1_automount_guard: true

    - name: Unit - the top-level teardown is a no-op when nothing is mounted
      block:
        - name: Run the top-level teardown on an unused mount point
          ansible.builtin.include_tasks: >-
            {{ playbook_dir }}/../../roles/snapshot/tasks/unmount_btrfs_top.yml
          vars:
            snapshot_top_mount_point: "{{ fixture_root }}/never-mounted"

        - name: Stat the snapshot fixtures after the teardown
          ansible.builtin.stat:
            path: "{{ fixture_snapshots }}"
          register: tier1_fixtures_after_teardown

        - name: Assert the teardown removed nothing else
          ansible.builtin.assert:
            that:
              - tier1_fixtures_after_teardown.stat.exists
              - tier1_fixtures_after_teardown.stat.isdir
            fail_msg: "Top-level teardown disturbed the snapshot fixtures"

    # Ports the checks 3/4/5/7 of /data/scripts/timeshift-check-snapshot.sh.
    # Tier 1 has no BTRFS filesystem, so the host boot state is seeded and the
    # audit is told not to probe it; the decision logic is what is under test.
    - name: Unit - the boot state audit stays silent on an independent snapshot
      block:
        - name: Run the boot state audit against the seeded host
          ansible.builtin.include_tasks: >-
            {{ playbook_dir }}/../../roles/snapshot/tasks/audit_boot_state.yml
          vars:
            snapshot_root: >-
              {{ fixture_root }}/top/timeshift-btrfs/snapshots/{{ fixture_snapshot }}/@
            snapshot_home: >-
              {{ fixture_root }}/top/timeshift-btrfs/snapshots/{{ fixture_snapshot }}/@home
            snapshot_top_mount: "{{ fixture_root }}/top"
            snapshot_root_dir: "{{ fixture_root }}/top/timeshift-btrfs/snapshots"
            snapshot_audit_collect_host_state: false
            snapshot_audit_same_filesystem: true
            snapshot_audit_host_rootid:
              stdout: "256"
            snapshot_audit_host_fsroot:
              stdout: "/@"
            snapshot_audit_default:
              stdout: "ID 256 gen 42 top level 5 path @"
            snapshot_audit_cmdline_raw:
              content: "{{ 'root=UUID=booting rw subvol=/@ quiet' | b64encode }}"
            snapshot_root_check:
              stdout: |
                Name:              @
                Subvolume ID:      257
                Flags:             readonly
            snapshot_home_check:
              stdout: |
                Name:              @home
                Subvolume ID:      258
                Flags:             readonly

        - name: Assert the audit found no overlap
          ansible.builtin.assert:
            that:
              - snapshot_audit_findings | length == 0
            fail_msg: >-
              A snapshot with its own subvolume IDs and an unrelated boot
              produced findings: {{ snapshot_audit_findings | join('; ') }}

    - name: Unit - the boot state audit flags a snapshot the host booted from
      block:
        - name: Run the audit against a host running from the snapshot
          ansible.builtin.include_tasks: >-
            {{ playbook_dir }}/../../roles/snapshot/tasks/audit_boot_state.yml
          vars:
            snapshot_root: >-
              {{ fixture_root }}/top/timeshift-btrfs/snapshots/{{ fixture_snapshot }}/@
            snapshot_home: >-
              {{ fixture_root }}/top/timeshift-btrfs/snapshots/{{ fixture_snapshot }}/@home
            snapshot_top_mount: "{{ fixture_root }}/top"
            snapshot_root_dir: "{{ fixture_root }}/top/timeshift-btrfs/snapshots"
            snapshot_audit_collect_host_state: false
            snapshot_audit_same_filesystem: true
            # Same ID as the host root, same default subvolume, and the kernel
            # command line boots straight into it: checks 3, 4, 5 and 7 at once.
            snapshot_root_check:
              stdout: |
                Name:              @
                Subvolume ID:      256
                Flags:             readonly
            snapshot_home_check:
              stdout: |
                Name:              @home
                Subvolume ID:      259
                Flags:             readonly
            snapshot_audit_host_rootid:
              stdout: "256"
            snapshot_audit_host_fsroot:
              stdout: "/timeshift-btrfs/snapshots/{{ fixture_snapshot }}/@"
            snapshot_audit_default:
              stdout: "ID 256 gen 42 top level 5 path timeshift-btrfs/snapshots/x/@"
            snapshot_audit_cmdline: >-
              root=UUID=booting rw subvol=/timeshift-btrfs/snapshots/{{ fixture_snapshot }}/@ quiet
            snapshot_audit_cmdline_raw:
              content: "{{ snapshot_audit_cmdline | trim | b64encode }}"

        - name: Assert every boot state overlap was detected
          ansible.builtin.assert:
            that:
              - snapshot_audit_root_is_live | bool
              - snapshot_audit_root_is_default | bool
              - snapshot_audit_kernel_boots_snapshot | bool
              - snapshot_audit_root_path_is_snapshot | bool
              - not (snapshot_audit_home_is_live | bool)
              - snapshot_audit_findings | length == 4
            fail_msg: >-
              Expected four findings (live root, default subvolume, kernel
              subvol=, root path), got: {{ snapshot_audit_findings | join('; ') }}

    - name: Negative - a snapshot the host booted from must abort in strict mode
      block:
        - name: Run the audit with snapshot_refuse_live_boot_state enabled
          ansible.builtin.include_tasks: >-
            {{ playbook_dir }}/../../roles/snapshot/tasks/audit_boot_state.yml
          vars:
            snapshot_root: >-
              {{ fixture_root }}/top/timeshift-btrfs/snapshots/{{ fixture_snapshot }}/@
            snapshot_home: >-
              {{ fixture_root }}/top/timeshift-btrfs/snapshots/{{ fixture_snapshot }}/@home
            snapshot_top_mount: "{{ fixture_root }}/top"
            snapshot_root_dir: "{{ fixture_root }}/top/timeshift-btrfs/snapshots"
            snapshot_audit_collect_host_state: false
            snapshot_audit_same_filesystem: true
            # The snapshot's @ is the subvolume the host booted from.
            snapshot_root_check:
              stdout: |
                Name:              @
                Subvolume ID:      256
                Flags:             readonly
            snapshot_home_check:
              stdout: |
                Name:              @home
                Subvolume ID:      259
                Flags:             readonly
            snapshot_audit_host_rootid:
              stdout: "256"
            snapshot_audit_host_fsroot:
              stdout: "/@"
            snapshot_audit_default:
              stdout: "ID 259 gen 42 top level 5 path @home"
            snapshot_audit_cmdline_raw:
              content: "{{ 'root=UUID=booting rw subvol=/@ quiet' | b64encode }}"
            snapshot_refuse_live_boot_state: true

        - name: Record a failed boot state guard
          ansible.builtin.set_fact:
            tier1_boot_state_guard: false
      rescue:
        - name: Record a successful boot state guard
          ansible.builtin.set_fact:
            tier1_boot_state_guard: true

    - name: Negative - the boot state guard is off by default
      block:
        - name: Run the audit with the same overlap but strict mode disabled
          ansible.builtin.include_tasks: >-
            {{ playbook_dir }}/../../roles/snapshot/tasks/audit_boot_state.yml
          vars:
            snapshot_root: >-
              {{ fixture_root }}/top/timeshift-btrfs/snapshots/{{ fixture_snapshot }}/@
            snapshot_home: >-
              {{ fixture_root }}/top/timeshift-btrfs/snapshots/{{ fixture_snapshot }}/@home
            snapshot_top_mount: "{{ fixture_root }}/top"
            snapshot_root_dir: "{{ fixture_root }}/top/timeshift-btrfs/snapshots"
            snapshot_audit_collect_host_state: false
            snapshot_audit_same_filesystem: true
            snapshot_root_check:
              stdout: |
                Subvolume ID:      256
            snapshot_home_check:
              stdout: |
                Subvolume ID:      259
            snapshot_audit_host_rootid:
              stdout: "256"
            snapshot_audit_host_fsroot:
              stdout: "/@"
            snapshot_audit_default:
              stdout: "ID 259 gen 42 top level 5 path @home"
            snapshot_audit_cmdline_raw:
              content: "{{ 'root=UUID=booting rw subvol=/@ quiet' | b64encode }}"
            snapshot_refuse_live_boot_state: false

        - name: Record that the overlap was only reported
          ansible.builtin.set_fact:
            tier1_boot_state_warn_only: true
      rescue:
        - name: Record that the overlap wrongly aborted the run
          ansible.builtin.set_fact:
            tier1_boot_state_warn_only: false

    - name: Unit - the boot state audit skips snapshots on another filesystem
      block:
        - name: Run the audit for a snapshot on a foreign filesystem
          ansible.builtin.include_tasks: >-
            {{ playbook_dir }}/../../roles/snapshot/tasks/audit_boot_state.yml
          vars:
            snapshot_root_dir: "{{ fixture_snapshots }}"
            snapshot_audit_collect_host_state: false
            snapshot_audit_same_filesystem: false

        - name: Assert the audit refused to compare unrelated subvolume IDs
          ansible.builtin.assert:
            that:
              - snapshot_audit_findings | default([]) | length == 0
              # An audit that did not run has to say so instead of staying quiet.
              - snapshot_audit_skipped_reason | default('') | length > 0
            fail_msg: >-
              The audit compared subvolume IDs across two filesystems, where
              they are not comparable, and reported findings it cannot justify.

    - name: Negative - confirm_restore=false must abort
      block:
        - name: Run the snapshot role without confirmation
          ansible.builtin.include_role:
            name: snapshot
          vars:
            confirm_restore: false

        - name: Record a failed confirmation guard
          ansible.builtin.set_fact:
            tier1_confirm_guard: false
      rescue:
        - name: Record a successful confirmation guard
          ansible.builtin.set_fact:
            tier1_confirm_guard: true

    - name: Negative - vm_disk outside vm_images_dir must abort
      block:
        - name: Run the snapshot role with a rogue disk path
          ansible.builtin.include_role:
            name: snapshot
          vars:
            vm_disk: /tmp/rogue.qcow2

        - name: Record a failed disk guard
          ansible.builtin.set_fact:
            tier1_disk_guard: false
      rescue:
        - name: Record a successful disk guard
          ansible.builtin.set_fact:
            tier1_disk_guard: true

    - name: Negative - an unknown snapshot must abort
      block:
        - name: Run the snapshot role with an unknown snapshot
          ansible.builtin.include_role:
            name: snapshot
          vars:
            snapshot: 1999-01-01_00-00-00

        - name: Record a failed snapshot guard
          ansible.builtin.set_fact:
            tier1_snapshot_guard: false
      rescue:
        - name: Record a successful snapshot guard
          ansible.builtin.set_fact:
            tier1_snapshot_guard: true

    - name: Negative - insufficient free space must abort
      block:
        - name: Run the snapshot role requesting an impossible disk
          ansible.builtin.include_role:
            name: snapshot
          vars:
            vm_disk_size: 100T

        - name: Record a failed space guard
          ansible.builtin.set_fact:
            tier1_space_guard: false
      rescue:
        - name: Record a successful space guard
          ansible.builtin.set_fact:
            tier1_space_guard: true

    - name: Negative - a snapshot that does not declare sys-uuid must abort
      block:
        - name: Run the snapshot role against the origin-less fixture
          ansible.builtin.include_role:
            name: snapshot
          vars:
            snapshot: "{{ fixture_bad_snapshot }}"

        - name: Record a failed provenance guard
          ansible.builtin.set_fact:
            tier1_provenance_guard: false
      rescue:
        - name: Record a successful provenance guard
          ansible.builtin.set_fact:
            tier1_provenance_guard: true

    - name: Assert every negative guard fired
      ansible.builtin.assert:
        that:
          - tier1_confirm_guard | default(false)
          - tier1_disk_guard | default(false)
          - tier1_snapshot_guard | default(false)
          - tier1_space_guard | default(false)
          - tier1_selector_guard | default(false)
          - tier1_provenance_guard | default(false)
          - tier1_boot_state_guard | default(false)
          - tier1_boot_state_warn_only | default(false)
        fail_msg: "One or more preflight guards did not fire as expected"
        success_msg: "All snapshot preflight guards fired correctly"

    - name: Disk role - validate defaults
      block:
        - name: Include the disk role defaults
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../roles/disk/defaults/main.yml"
            name: disk_defaults

        - name: Assert disk role defaults are defined
          ansible.builtin.assert:
            that:
              - disk_defaults.disk_btrfs_label is defined
              - disk_defaults.disk_btrfs_label | length > 0
              - disk_defaults.disk_nbd_max_retries is defined
              - disk_defaults.disk_nbd_max_retries | int > 0
              - disk_defaults.disk_nbd_wait_timeout is defined
              - disk_defaults.disk_nbd_wait_timeout | int > 0
              - disk_defaults.disk_mount_opts_btrfs is defined
              - disk_defaults.disk_mount_opts_efi is defined
            fail_msg: "Disk role defaults are missing or invalid"

    - name: Disk role - teardown idempotency (no-op when nothing mounted)
      block:
        - name: Seed teardown variables (no mounts, no NBD)
          ansible.builtin.set_fact:
            vm_mount_root: /tmp/nonexistent-mount
            vm_mount_efi: /tmp/nonexistent-efi
            nbd_device: /dev/nonexistent
            vm_disk: /tmp/nonexistent.qcow2

        - name: Run teardown (should be a no-op)
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../../roles/disk/tasks/teardown.yml"

        - name: Record successful teardown idempotency
          ansible.builtin.set_fact:
            tier1_teardown_idempotent: true
      rescue:
        - name: Record failed teardown idempotency
          ansible.builtin.set_fact:
            tier1_teardown_idempotent: false

        - name: Fail the test
          ansible.builtin.fail:
            msg: "Teardown is not idempotent when nothing is mounted"

    - name: Assert disk role tests passed
      ansible.builtin.assert:
        that:
          - tier1_teardown_idempotent | default(false)
        fail_msg: "Disk role tests failed"
        success_msg: "Disk role Tier 1 tests passed"

    - name: Restore role - validate required facts are enforced
      block:
        - name: Run restore role with missing facts
          ansible.builtin.include_role:
            name: restore
          vars:
            snapshot_root: ""
            snapshot_home: ""
            nbd_device: ""
            vm_btrfs_uuid: ""
            vm_efi_uuid: ""
            vm_mount_root: ""

        - name: Record a failed validation guard
          ansible.builtin.set_fact:
            tier1_restore_validation_guard: false
      rescue:
        - name: Record a successful validation guard
          ansible.builtin.set_fact:
            tier1_restore_validation_guard: true

    - name: Restore role - fstab template generates correct content
      block:
        - name: Seed partition UUIDs for fstab rendering
          ansible.builtin.set_fact:
            vm_btrfs_uuid: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
            vm_efi_uuid: "11111111-2222-3333-4444-555555555555"

        - name: Render the fstab template
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../roles/restore/templates/fstab.j2"
            dest: /tmp/tier1-fstab.rendered
            mode: "0644"

        - name: Read the rendered fstab
          ansible.builtin.slurp:
            src: /tmp/tier1-fstab.rendered
          register: tier1_fstab_content

        - name: Assert fstab contains correct UUID references
          ansible.builtin.assert:
            that:
              - "'aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee' in tier1_fstab_content.content | b64decode"
              - "'11111111-2222-3333-4444-555555555555' in tier1_fstab_content.content | b64decode"
              - "'subvol=/@' in tier1_fstab_content.content | b64decode"
              - "'subvol=/@home' in tier1_fstab_content.content | b64decode"
              - "'/boot' in tier1_fstab_content.content | b64decode"
            fail_msg: "Fstab template did not render correctly"
            success_msg: "Fstab template renders correct UUID references"

        - name: Record successful fstab test
          ansible.builtin.set_fact:
            tier1_fstab_test: true
      rescue:
        - name: Record failed fstab test
          ansible.builtin.set_fact:
            tier1_fstab_test: false

    - name: Assert restore role tests passed
      ansible.builtin.assert:
        that:
          - tier1_restore_validation_guard | default(false)
          - tier1_fstab_test | default(false)
        fail_msg: "Restore role tests failed"
        success_msg: "Restore role Tier 1 tests passed"

    - name: Boot role - validate required facts are enforced
      block:
        - name: Run boot role with missing facts
          ansible.builtin.include_role:
            name: boot
          vars:
            work_dir: ""
            nbd_device: ""

        - name: Record a failed validation guard
          ansible.builtin.set_fact:
            tier1_boot_validation_guard: false
      rescue:
        - name: Record a successful validation guard
          ansible.builtin.set_fact:
            tier1_boot_validation_guard: true

    - name: Boot role - validate restored root check is enforced
      block:
        - name: Run boot role with non-existent restored root
          ansible.builtin.include_role:
            name: boot
          vars:
            work_dir: "/tmp/nonexistent-workdir"
            nbd_device: "/dev/nonexistent"

        - name: Record a failed restored root guard
          ansible.builtin.set_fact:
            tier1_boot_restored_root_guard: false
      rescue:
        - name: Record a successful restored root guard
          ansible.builtin.set_fact:
            tier1_boot_restored_root_guard: true

    - name: Assert boot role tests passed
      ansible.builtin.assert:
        that:
          - tier1_boot_validation_guard | default(false)
          - tier1_boot_restored_root_guard | default(false)
        fail_msg: "Boot role tests failed"
        success_msg: "Boot role Tier 1 tests passed"

    - name: Boot role - guest agent wiring detects and enables a supported clone
      block:
        - name: Create a synthetic clone root with a QEMU guest agent
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ fixture_root }}/clone-root"
            - "{{ fixture_root }}/clone-root/usr/bin"
            - "{{ fixture_root }}/clone-root/usr/lib/systemd/system"

        - name: Seed a fake qemu-ga binary in the clone
          ansible.builtin.copy:
            content: "#!/bin/sh\nexit 0\n"
            dest: "{{ fixture_root }}/clone-root/usr/bin/qemu-ga"
            mode: "0755"

        - name: Seed the qemu-guest-agent service unit in the clone
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=QEMU Guest Agent

              [Service]
              ExecStart=/usr/bin/qemu-ga

              [Install]
              WantedBy=multi-user.target
            dest: "{{ fixture_root }}/clone-root/usr/lib/systemd/system/qemu-guest-agent.service"
            mode: "0644"

        - name: Wire the QEMU guest agent on the supported clone
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../../roles/boot/tasks/guest_agent.yml"
          vars:
            boot_restored_root: "{{ fixture_root }}/clone-root"

        - name: Inspect the enabled guest agent service symlink
          ansible.builtin.stat:
            path: "{{ fixture_root }}/clone-root/etc/systemd/system/multi-user.target.wants/qemu-guest-agent.service"
            follow: false
          register: tier1_guest_agent_wants

        - name: Assert the supported clone published and enabled the agent
          ansible.builtin.assert:
            that:
              - boot_guest_agent_available | bool
              - tier1_guest_agent_wants.stat.islnk
              - "'qemu-guest-agent.service' in (tier1_guest_agent_wants.stat.lnk_target | default(''))"
            fail_msg: "The supported clone did not publish or enable the guest agent"
            success_msg: "Guest agent wiring detected and enabled the supported clone"

    - name: Boot role - guest agent wiring skips a clone without the agent
      block:
        - name: Wire the QEMU guest agent on a clone without the agent
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../../roles/boot/tasks/guest_agent.yml"
          vars:
            boot_restored_root: "{{ fixture_root }}"

        - name: Assert the unsupported clone is skipped cleanly
          ansible.builtin.assert:
            that:
              - not (boot_guest_agent_available | bool)
            fail_msg: "The clone without qemu-ga was reported as supporting the agent"
            success_msg: "Guest agent wiring skipped the unsupported clone"

    - name: Libvirt role - validate required facts are enforced
      block:
        - name: Run libvirt role with empty facts
          ansible.builtin.include_role:
            name: libvirt
          vars:
            vm_name: ""
            vm_disk: ""
            work_dir: ""

        - name: Record a failed validation guard
          ansible.builtin.set_fact:
            tier1_libvirt_validation_guard: false
      rescue:
        - name: Record a successful validation guard
          ansible.builtin.set_fact:
            tier1_libvirt_validation_guard: true

    - name: Libvirt role - validate defaults
      block:
        - name: Include the libvirt role defaults
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../roles/libvirt/defaults/main.yml"
            name: libvirt_defaults

        - name: Assert libvirt role defaults are defined
          ansible.builtin.assert:
            that:
              - libvirt_defaults.libvirt_start is defined
              - libvirt_defaults.libvirt_attach_iso is defined
              - libvirt_defaults.libvirt_graphics is defined
              - libvirt_defaults.libvirt_graphics | length > 0
              - libvirt_defaults.libvirt_gl_enable is defined
              - libvirt_defaults.libvirt_machine is defined
              - libvirt_defaults.libvirt_undefine_before is defined
              - libvirt_defaults.libvirt_xml_validate is defined
            fail_msg: "Libvirt role defaults are missing"

    - name: Libvirt role - template renders without ISO
      block:
        - name: Seed variables for template rendering
          ansible.builtin.set_fact:
            vm_name: tier1-render-test
            vm_memory_mib: 2048
            vm_vcpus: 2
            vm_disk: /tmp/render-test.qcow2
            network_name: default
            vm_network_mode: isolated
            libvirt_interface_network: virbr-arch-timeshift-vm
            arch_iso: /tmp/nonexistent.iso
            ovmf_code: /usr/share/edk2/x64/OVMF_CODE.4m.fd
            nvram_file: /tmp/render-test_VARS.fd
            libvirt_attach_iso: false
            libvirt_graphics: spice
            libvirt_gl_enable: false
            libvirt_spice_rendernode: /dev/dri/renderD128
            libvirt_machine: ""

        - name: Render the domain XML without ISO
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../roles/libvirt/templates/domain.xml.j2"
            dest: /tmp/tier1-domain-noiso.xml
            mode: "0644"

        - name: Read the rendered XML
          ansible.builtin.slurp:
            src: /tmp/tier1-domain-noiso.xml
          register: tier1_xml_noiso

        - name: Assert XML omits CDROM and has disk
          ansible.builtin.assert:
            that:
              - "'cdrom' not in (tier1_xml_noiso.content | b64decode)"
              - "'device=\"disk\"' in (tier1_xml_noiso.content | b64decode)"
              - "vm_name in (tier1_xml_noiso.content | b64decode)"
              - "vm_disk in (tier1_xml_noiso.content | b64decode)"
              - "'machine=' not in (tier1_xml_noiso.content | b64decode)"
              - "'network=\"virbr-arch-timeshift-vm\"' in (tier1_xml_noiso.content | b64decode)"
            fail_msg: "XML without ISO did not render correctly"

    - name: Libvirt role - template renders with ISO
      block:
        - name: Seed variables for template rendering with ISO
          ansible.builtin.set_fact:
            libvirt_attach_iso: true

        - name: Render the domain XML with ISO
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../roles/libvirt/templates/domain.xml.j2"
            dest: /tmp/tier1-domain-iso.xml
            mode: "0644"

        - name: Read the rendered XML with ISO
          ansible.builtin.slurp:
            src: /tmp/tier1-domain-iso.xml
          register: tier1_xml_iso

        - name: Assert XML includes CDROM
          ansible.builtin.assert:
            that:
              - "'cdrom' in (tier1_xml_iso.content | b64decode)"
              - "arch_iso in (tier1_xml_iso.content | b64decode)"
            fail_msg: "XML with ISO did not include CDROM device"

    - name: Libvirt role - template renders headless (no graphics)
      block:
        - name: Seed headless graphics
          ansible.builtin.set_fact:
            libvirt_graphics: none

        - name: Render the domain XML headless
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../roles/libvirt/templates/domain.xml.j2"
            dest: /tmp/tier1-domain-headless.xml
            mode: "0644"

        - name: Read the headless XML
          ansible.builtin.slurp:
            src: /tmp/tier1-domain-headless.xml
          register: tier1_xml_headless

        - name: Assert headless XML omits graphics and keeps serial output
          ansible.builtin.assert:
            that:
              - "'<graphics' not in (tier1_xml_headless.content | b64decode)"
              - "'type=\"none\"' not in (tier1_xml_headless.content | b64decode)"
              - "'<serial type=\"pty\">' in (tier1_xml_headless.content | b64decode)"
            fail_msg: "Headless XML did not render correctly"

    - name: Libvirt role - template renders with GL acceleration
      block:
        - name: Seed GL graphics
          ansible.builtin.set_fact:
            libvirt_graphics: spice
            libvirt_gl_enable: true

        - name: Render the domain XML with GL
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../roles/libvirt/templates/domain.xml.j2"
            dest: /tmp/tier1-domain-gl.xml
            mode: "0644"

        - name: Read the GL XML
          ansible.builtin.slurp:
            src: /tmp/tier1-domain-gl.xml
          register: tier1_xml_gl

        - name: Assert GL XML includes rendernode
          ansible.builtin.assert:
            that:
              - "'gl enable=\"yes\"' in (tier1_xml_gl.content | b64decode)"
              - "'rendernode' in (tier1_xml_gl.content | b64decode)"
            fail_msg: "GL XML did not include acceleration"

    - name: Libvirt role - template renders without a NIC
      block:
        - name: Disable the VM network interface
          ansible.builtin.set_fact:
            vm_network_mode: none
            libvirt_graphics: spice

        - name: Render the domain XML without NIC
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../roles/libvirt/templates/domain.xml.j2"
            dest: /tmp/tier1-domain-nonic.xml
            mode: "0644"

        - name: Read the NIC-less XML
          ansible.builtin.slurp:
            src: /tmp/tier1-domain-nonic.xml
          register: tier1_xml_nonic

        - name: Assert NIC-less XML omits the interface
          ansible.builtin.assert:
            that:
              - "'<interface' not in (tier1_xml_nonic.content | b64decode)"
              - "'<serial type=\"pty\">' in (tier1_xml_nonic.content | b64decode)"
            fail_msg: "NIC-less XML still contained an interface"

    - name: Libvirt role - teardown is idempotent (no-op)
      block:
        - name: Seed teardown variables (no domain, no NVRAM)
          ansible.builtin.set_fact:
            vm_name: tier1-teardown-nonexistent
            nvram_dir: /tmp/nonexistent-nvram
            work_dir: /tmp/nonexistent-workdir

        - name: Run teardown (should be a no-op)
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../../roles/libvirt/tasks/teardown.yml"

        - name: Record successful teardown idempotency
          ansible.builtin.set_fact:
            tier1_libvirt_teardown_idempotent: true
      rescue:
        - name: Record failed teardown idempotency
          ansible.builtin.set_fact:
            tier1_libvirt_teardown_idempotent: false

    - name: Assert libvirt role tests passed
      ansible.builtin.assert:
        that:
          - tier1_libvirt_validation_guard | default(false)
          - tier1_libvirt_teardown_idempotent | default(false)
        fail_msg: "Libvirt role tests failed"
        success_msg: "Libvirt role Tier 1 tests passed"
