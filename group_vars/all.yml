---
# Safety: the playbook will refuse to proceed unless this is true.
confirm_restore: false

vm_name: archlinux-timeshift
vm_memory_mib: 4096
vm_vcpus: 4

# Base directory that owns every VM disk. Destructive paths must live below it.
vm_images_dir: /data/libvirt/images
vm_disk: "{{ vm_images_dir }}/{{ vm_name }}.qcow2"
vm_disk_size: 120G

# Host paths
# "auto" detects the real Timeshift snapshot directory (BTRFS top-level) at
# runtime; set an explicit path only for unusual layouts.
timeshift_root: auto
work_dir: /data/timeshift-vm-work
nvram_dir: /var/lib/libvirt/qemu/nvram

# Set to "latest" or an exact Timeshift snapshot directory name.
snapshot: latest

# EFI partition size in MiB
efi_size_mib: 1024

# VM networking
network_name: default

# Optional: leave the ISO attached for rescue. VM still boots from disk first.
arch_iso: /data/libvirt/iso/archlinux-x86_64.iso

# Libvirt domain options
libvirt_start: true
libvirt_attach_iso: true
libvirt_graphics: spice
libvirt_gl_enable: false
libvirt_spice_rendernode: /dev/dri/by-path/pci-0000:00:02.0-render
libvirt_machine: ""
