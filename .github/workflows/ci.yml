---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Provision the dev virtualenv
        run: make venv
      - name: Install Ansible collections
        run: make deps
      - name: yamllint + ansible-lint (production profile)
        run: make lint
      - name: Playbook syntax checks
        run: make syntax
      - name: Scan development dependencies for vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements-dev.txt

  tier1:
    name: Molecular Tier 1 (unprivileged, Docker)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Provision the dev virtualenv
        run: make venv
      - name: Install Ansible collections
        run: make deps
      - name: Build the Tier 1 test image
        run: make test-image
      - name: Scan the Tier 1 test image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: arch-timeshift-test:latest
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Run Molecule Tier 1
        run: make test

  # real-boot E2E (Tier 3) is opt-in: it needs a self-hosted runner tagged
  # ['self-hosted','linux','x64','arch-timeshift-vm'] with libvirt, KVM and a
  # mounted Timeshift snapshot root. See docs/ROADMAP.md (P1).
  e2e:
    name: Tier 3 real boot
    runs-on: [self-hosted, linux, x64, arch-timeshift-vm]
    needs: quality
    if: github.event_name == 'workflow_dispatch'
    env:
      E2E_TIMESHIFT_ROOT: ${{ secrets.E2E_TIMESHIFT_ROOT }}
      E2E_SNAPSHOT: latest
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision the dev virtualenv
        run: make venv
      - name: Install Ansible collections
        run: make deps
      - name: Run the real-boot E2E
        run: make e2e
