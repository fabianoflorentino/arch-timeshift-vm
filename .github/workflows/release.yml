---
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract the changelog for the current version
        id: changelog
        run: |
          section="$(awk '/^## /{if (found) exit} /^## /{found=1} found' CHANGELOG.md | head -n -1)"
          EOF=$(openssl rand -hex 16)
          printf 'body<<%s\n%s\n%s\n' "$EOF" "$section" "$EOF" >> "$GITHUB_OUTPUT"
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.body }}
          draft: true
