---
# Preflight validation of the restore pipeline. Runs only the snapshot role:
# snapshot resolution, provenance, safety gates and free space checks. No VM
# disk is touched. The one mutation is the ephemeral read-only BTRFS top-level
# mount under /run, which is released at the end of the run - including when a
# guard aborts the play, which is the case that used to leave the host holding a
# top-level mount.
#
# The mount cannot be released by the snapshot role itself: the restore role
# later feeds `btrfs send` from the same paths, so the mount has to outlive the
# role and be owned by the play instead.
- name: Preflight validation of the restore pipeline
  hosts: localhost
  become: true
  gather_facts: true

  # Ansible auto-loads group_vars only next to the inventory or next to the
  # playbook. This configuration lives at the repository root, so a playbook
  # under playbooks/ would run unconfigured. Load it explicitly, like
  # restore.yml: the always cleanup below also needs snapshot_stage_root, which
  # only exists as a role default otherwise.
  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Validate the snapshot and the destructive paths
      block:
        - name: Run the snapshot role
          ansible.builtin.include_role:
            name: snapshot
      always:
        - name: Release the ephemeral BTRFS top-level mount
          when: snapshot_top_mount_temporary | default(false) | bool
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../roles/snapshot/tasks/unmount_btrfs_top.yml"
          vars:
            # unmount_btrfs_top.yml takes the mount point as an argument, and the
            # role default is not visible in the play scope. snapshot_top_mount
            # is the path the role mounted and published as a fact.
            snapshot_top_mount_point: "{{ snapshot_top_mount }}"

        - name: Remove the disposable snapshot copy
          when:
            - snapshot_stage_dir is defined
            - snapshot_stage_dir | length > 0
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../roles/snapshot/tasks/remove_staged_snapshot.yml"
