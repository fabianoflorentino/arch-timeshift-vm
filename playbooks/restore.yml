---
# Restore an Arch Timeshift snapshot into a disposable libvirt VM
- name: Restore an Arch Timeshift snapshot into a disposable libvirt VM
  hosts: localhost
  become: true
  gather_facts: true

  # Ansible auto-loads group_vars only next to the inventory or next to the
  # playbook. This configuration lives at the repository root, so a playbook
  # under playbooks/ would run unconfigured: every vm_*/work_dir/timeshift_root
  # value would be undefined. Load it explicitly instead.
  vars_files:
    - ../group_vars/all.yml

  # The ephemeral read-only BTRFS top-level mount created by the snapshot role
  # must stay up until `btrfs send` has read the snapshot into the VM disk, so
  # it is owned by the play rather than by a role. `always` releases it even
  # when a guard aborts the pipeline halfway, which is what used to leave the
  # host holding a top-level mount.
  tasks:
    - name: Initialize restore cleanup state
      ansible.builtin.set_fact:
        restore_pipeline_error: ""

    - name: Run the restore pipeline and always release the temporary snapshot mount
      block:
        - name: Run the snapshot role
          ansible.builtin.include_role:
            name: snapshot

        - name: Run the disk role
          ansible.builtin.include_role:
            name: disk

        - name: Run the restore role
          ansible.builtin.include_role:
            name: restore

        - name: Run the boot role
          ansible.builtin.include_role:
            name: boot

        - name: Run the libvirt role
          ansible.builtin.include_role:
            name: libvirt
      rescue:
        - name: Record the restore pipeline failure
          ansible.builtin.set_fact:
            restore_pipeline_error: >-
              {{ ansible_failed_result.msg
                 | default(ansible_failed_result | string) }}
      always:
        - name: Release the ephemeral BTRFS top-level mount
          when: snapshot_top_mount_owned | default(false) | bool
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../roles/snapshot/tasks/unmount_btrfs_top.yml"
          vars:
            # unmount_btrfs_top.yml takes the mount point as an argument, and the
            # role default is not visible in the play scope. snapshot_top_mount
            # is the path the role mounted and published as a fact.
            snapshot_top_mount_point: "{{ snapshot_top_mount }}"

        - name: Remove the disposable snapshot copy
          when:
            - snapshot_stage_dir is defined
            - snapshot_stage_dir | length > 0
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../roles/snapshot/tasks/remove_staged_snapshot.yml"

    - name: Report restore pipeline or snapshot mount cleanup failures
      ansible.builtin.assert:
        that:
          - restore_pipeline_error | length == 0
          - snapshot_cleanup_error | default('') | length == 0
          - snapshot_stage_cleanup_error | default('') | length == 0
        fail_msg: >-
          {{ restore_pipeline_error }}
          {{ snapshot_cleanup_error | default('') }}
          {{ snapshot_stage_cleanup_error | default('') }}
        quiet: true

  post_tasks:
    - name: Emit the audit summary
      when: resolved_snapshot is defined and resolved_snapshot | length > 0
      ansible.builtin.debug:
        msg:
          - "Snapshot  : {{ resolved_snapshot }}"
          - "Provenance: created={{ snapshot_meta_created_human | default('n/a', true) }}"
          - "              host={{ snapshot_meta_hostname | default('n/a', true) }}"
          - "              uuid={{ snapshot_meta_sys_uuid | default('n/a', true) }}"
          - "VM        : {{ vm_name }}"
          - "Disk      : {{ vm_disk_real | default(vm_disk) }}"
          - "State     : {{ libvirt_vm_state.stdout | default('n/a') | trim }}"
          - "Network   : {{ libvirt_interface_network | default(network_name) }}"
