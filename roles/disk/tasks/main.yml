---
- name: Create work directory
  ansible.builtin.file:
    path: "{{ work_dir }}"
    state: directory
    mode: "0755"

- name: Ensure VM is stopped
  ansible.builtin.command: "virsh destroy {{ vm_name }}"
  register: destroy_result
  changed_when: destroy_result.rc == 0
  failed_when: false

- name: Undefine old VM if present
  ansible.builtin.command: "virsh undefine {{ vm_name }} --nvram"
  register: undefine_result
  changed_when: undefine_result.rc == 0
  failed_when: false

- name: Remove old VM disk
  ansible.builtin.file:
    path: "{{ vm_disk }}"
    state: absent

- name: Create qcow2 disk
  ansible.builtin.command:
    argv:
      - qemu-img
      - create
      - -f
      - qcow2
      - "{{ vm_disk }}"
      - "{{ vm_disk_size }}"

- name: Load nbd module
  ansible.builtin.command: modprobe nbd max_part=16
  changed_when: false

- name: Connect qcow2 to first free NBD
  ansible.builtin.shell: |
    set -euo pipefail
    for nbd in /dev/nbd{0..15}; do
      if [ "$(blockdev --getsize64 "$nbd" 2>/dev/null || echo 0)" = "0" ]; then
        qemu-nbd --connect="$nbd" "{{ vm_disk }}"
        echo "$nbd"
        exit 0
      fi
    done
    echo "No free /dev/nbd device" >&2
    exit 1
  args:
    executable: /bin/bash
  register: nbd_attach
  changed_when: true

- name: Save NBD device
  ansible.builtin.set_fact:
    nbd_device: "{{ nbd_attach.stdout_lines[-1] }}"

- name: Wait for NBD device
  ansible.builtin.wait_for:
    path: "{{ nbd_device }}"
    state: present
    timeout: 10

- name: Create GPT with EFI and BTRFS partitions
  ansible.builtin.command:
    argv:
      - sgdisk
      - --zap-all
      - --new=1:1:+{{ efi_size_mib }}M
      - --typecode=1:ef00
      - --change-name=1:EFI
      - --new=2:0:0
      - --typecode=2:8300
      - --change-name=2:Arch-BTRFS
      - "{{ nbd_device }}"

- name: Inform kernel of partition table
  ansible.builtin.command: partprobe "{{ nbd_device }}"
  changed_when: false

- name: Wait for EFI partition
  ansible.builtin.wait_for:
    path: "{{ nbd_device }}p1"
    state: present
    timeout: 10

- name: Wait for BTRFS partition
  ansible.builtin.wait_for:
    path: "{{ nbd_device }}p2"
    state: present
    timeout: 10

- name: Format EFI partition
  ansible.builtin.command:
    argv:
      - mkfs.fat
      - -F32
      - -n
      - EFI
      - "{{ nbd_device }}p1"

- name: Format BTRFS partition
  ansible.builtin.command:
    argv:
      - mkfs.btrfs
      - -f
      - -L
      - ArchVM
      - "{{ nbd_device }}p2"

- name: Read VM partition UUIDs
  ansible.builtin.command: "blkid -s UUID -o value {{ item }}"
  loop:
    - "{{ nbd_device }}p1"
    - "{{ nbd_device }}p2"
  register: partition_uuids
  changed_when: false

- name: Store UUIDs
  ansible.builtin.set_fact:
    vm_efi_uuid: "{{ partition_uuids.results[0].stdout | trim }}"
    vm_btrfs_uuid: "{{ partition_uuids.results[1].stdout | trim }}"

- name: Create mount points
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ work_dir }}/mnt"
    - "{{ work_dir }}/mnt/home"
    - "{{ work_dir }}/mnt/boot"

- name: Mount VM BTRFS top-level
  ansible.posix.mount:
    path: "{{ work_dir }}/mnt"
    src: "{{ nbd_device }}p2"
    fstype: btrfs
    opts: "subvolid=5"
    state: mounted

- name: Mount EFI
  ansible.posix.mount:
    path: "{{ work_dir }}/mnt/boot"
    src: "{{ nbd_device }}p1"
    fstype: vfat
    opts: "fmask=0022,dmask=0022"
    state: mounted
