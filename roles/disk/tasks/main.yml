---
- name: Ensure work directory exists
  ansible.builtin.file:
    path: "{{ work_dir }}"
    state: directory
    mode: "0755"

- name: Ensure old VM is stopped and undefined
  block:
    - name: Stop the VM if running
      ansible.builtin.command:
        cmd: virsh destroy {{ vm_name }}
      register: disk_virsh_destroy
      changed_when: disk_virsh_destroy.rc == 0
      failed_when: false

    - name: Undefine the VM if it exists
      ansible.builtin.command:
        cmd: virsh undefine {{ vm_name }} --nvram
      register: disk_virsh_undefine
      changed_when: disk_virsh_undefine.rc == 0
      failed_when: false

- name: Create atomic disk with NBD, partitions, and ephemeral mounts
  block:
    - name: Remove stale temporary disk if it exists
      ansible.builtin.file:
        path: "{{ vm_disk }}.new"
        state: absent

    - name: Create temporary qcow2 disk
      ansible.builtin.command:
        argv:
          - qemu-img
          - create
          - -f
          - qcow2
          - "{{ vm_disk }}.new"
          - "{{ vm_disk_size }}"
      changed_when: true

    - name: Load the nbd kernel module
      ansible.builtin.command:
        cmd: modprobe nbd max_part=16
      changed_when: false

    - name: Find a free NBD device
      ansible.builtin.shell: |
        set -euo pipefail
        for nbd in {{ disk_nbd_devices }}; do
          if [ "$(blockdev --getsize64 "$nbd" 2>/dev/null || echo 0)" = "0" ]; then
            echo "$nbd"
            exit 0
          fi
        done
        echo "No free NBD device found" >&2
        exit 1
      args:
        executable: /bin/bash
      register: disk_nbd_find
      changed_when: false

    - name: Store the NBD device path
      ansible.builtin.set_fact:
        nbd_device: "{{ disk_nbd_find.stdout_lines[-1] }}"

    - name: Connect the qcow2 to the NBD device
      ansible.builtin.command:
        cmd: qemu-nbd --connect={{ nbd_device }} {{ vm_disk }}.new
      changed_when: true

    - name: Wait for the NBD device to be ready
      ansible.builtin.wait_for:
        path: "{{ nbd_device }}"
        state: present
        timeout: "{{ disk_nbd_wait_timeout }}"

    - name: Create GPT partition table
      ansible.builtin.command:
        argv:
          - sgdisk
          - --zap-all
          - --new=1:0:+{{ efi_size_mib }}M
          - --typecode=1:ef00
          - --change-name=1:EFI
          - --new=2:0:0
          - --typecode=2:8300
          - --change-name=2:BTRFS-Root
          - "{{ nbd_device }}"
      changed_when: true

    - name: Inform the kernel of partition changes
      ansible.builtin.command:
        cmd: partprobe {{ nbd_device }}
      changed_when: false

    - name: Wait for EFI partition
      ansible.builtin.wait_for:
        path: "{{ nbd_device }}p1"
        state: present
        timeout: "{{ disk_nbd_wait_timeout }}"

    - name: Wait for BTRFS partition
      ansible.builtin.wait_for:
        path: "{{ nbd_device }}p2"
        state: present
        timeout: "{{ disk_nbd_wait_timeout }}"

    - name: Format the EFI partition
      ansible.builtin.command:
        argv:
          - mkfs.fat
          - -F32
          - -n
          - EFI
          - "{{ nbd_device }}p1"
      changed_when: true

    - name: Format the BTRFS partition
      ansible.builtin.command:
        argv:
          - mkfs.btrfs
          - -f
          - -L
          - "{{ disk_btrfs_label }}"
          - "{{ nbd_device }}p2"
      changed_when: true

    - name: Read partition UUIDs
      ansible.builtin.command:
        cmd: blkid -s UUID -o value {{ item }}
      loop:
        - "{{ nbd_device }}p1"
        - "{{ nbd_device }}p2"
      register: disk_partition_uuids
      changed_when: false

    - name: Store partition UUIDs
      ansible.builtin.set_fact:
        vm_efi_uuid: "{{ disk_partition_uuids.results[0].stdout | trim }}"
        vm_btrfs_uuid: "{{ disk_partition_uuids.results[1].stdout | trim }}"

    - name: Store mount paths
      ansible.builtin.set_fact:
        vm_mount_root: "{{ work_dir }}/mnt"
        vm_mount_efi: "{{ work_dir }}/mnt/boot"

    - name: Create ephemeral root mount point
      ansible.builtin.file:
        path: "{{ vm_mount_root }}"
        state: directory
        mode: "0755"

    - name: Mount BTRFS top-level  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: mount -t btrfs -o {{ disk_mount_opts_btrfs }} {{ nbd_device }}p2 {{ vm_mount_root }}
      changed_when: true

    - name: Create EFI mount point inside BTRFS
      ansible.builtin.file:
        path: "{{ vm_mount_efi }}"
        state: directory
        mode: "0755"

    - name: Mount EFI partition  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: mount -t vfat -o {{ disk_mount_opts_efi }} {{ nbd_device }}p1 {{ vm_mount_efi }}
      changed_when: true

    - name: Remove old VM disk if it exists
      ansible.builtin.file:
        path: "{{ vm_disk }}"
        state: absent

    - name: Atomic swap - rename temporary disk to final
      ansible.builtin.command:
        cmd: mv {{ vm_disk }}.new {{ vm_disk }}
      changed_when: true

  rescue:
    - name: Teardown on failure
      ansible.builtin.include_tasks:
        file: teardown.yml

    - name: Re-raise the error
      ansible.builtin.fail:
        msg: "Disk creation failed, cleaned up temporary artifacts"
