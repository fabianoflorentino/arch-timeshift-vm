---
# Base directory that owns every VM disk. Destructive paths must live below it.
vm_images_dir: /data/libvirt/images

# Timeshift snapshot root. "auto" detects the BTRFS top-level subvolume and
# derives <top>/timeshift-btrfs/snapshots at runtime.
timeshift_root: auto

# Optional device override for auto-detection. Empty means "derive from /".
# Mainly a test seam for synthetic BTRFS sandboxes.
timeshift_device: ""

# Timeshift stores snapshots in the BTRFS top-level (subvolid=5), next to @ and
# @home, so they are unreachable while that subvolume is not mounted - the usual
# `subvol=/@` layout has no top-level mount. When true, auto-detection mounts it
# read-only under /run for the duration of the playbook and releases it at the
# end. Set to false to keep auto-detection strictly read-only and require a
# pre-existing top-level mount (or an explicit timeshift_root).
timeshift_autodetect_mount_top: true

# Where the ephemeral top-level mount is placed when the host has none. /run is
# a tmpfs, so the mountpoint never survives a reboot.
snapshot_top_mount_point: /run/arch-timeshift-vm/btrfs-top

# Mount options for that ephemeral mount. Read-only is enough: the run only
# reads the real snapshot to take a copy-on-write copy of it, never to stream or
# modify it.
snapshot_top_mount_opts: "subvolid=5,ro"

# Where the run creates its disposable read-only BTRFS copy of the snapshot.
# `btrfs send` refuses a read-write subvolume and Timeshift snapshots are
# read-write, so the pipeline never streams the real snapshot: it takes a
# copy-on-write snapshot of it (`btrfs subvolume snapshot -r`) and streams that.
# A COW copy shares every extent with its source, so it costs almost no space,
# but `btrfs subvolume snapshot` only works within one filesystem: this path
# MUST live on the same BTRFS filesystem as the snapshots. A path on another
# filesystem (an ext4 disk, say) is rejected with a clear error.
snapshot_stage_root: /var/tmp/arch-timeshift-vm-stage

# Free space the staging filesystem must keep. The COW copy itself needs only
# metadata, so this is a safety margin against a filesystem filling up while the
# pipeline runs.
snapshot_stage_min_free_bytes: 1G

# Read /etc/timeshift/timeshift.json to report the device Timeshift backs up.
# Only used for diagnostics; a missing or unreadable file is not fatal.
snapshot_timeshift_config: /etc/timeshift/timeshift.json

# Boot-state audit: report when the snapshot being restored is also the
# subvolume this host booted from, the filesystem default subvolume, or the
# subvolume named by the kernel command line. Findings are warnings by default
# (booting from a snapshot is a legitimate recovery mode and this pipeline never
# deletes snapshots). Set true to refuse such a snapshot outright.
snapshot_refuse_live_boot_state: false

# Commands required by the full restore pipeline. Fail early with a single
# clear message when any is missing.
snapshot_required_commands:
  - btrfs
  - blkid
  - findmnt
  - mount
  - mountpoint
  - realpath
  - qemu-img
  - qemu-nbd
  - sgdisk
  - mkfs.fat
  - umount
  - virsh
  - virt-xml-validate
  - grub-install
  - efibootmgr
  - arch-chroot

# What the confirmation gate reports about the current run. The gate is shared
# by the destructive restore and the read-only preflight, so each caller names
# its own scope instead of the message always claiming a disk is overwritten.
confirm_scope_note: run creates and overwrites a VM disk

# Extra free-space headroom (percent) required on the VM disk filesystem.
disk_space_headroom_percent: 10
