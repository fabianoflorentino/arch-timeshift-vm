---
# Resolve and validate the snapshot and the destructive VM disk path. The real
# snapshot is read-only throughout: the run takes a copy-on-write read-only copy
# of it and streams that instead (see stage_snapshot.yml). The only writes are
# that copy and, when the host has no BTRFS top-level mount, an ephemeral
# read-only mount under /run (see timeshift_autodetect_mount_top). The caller
# releases both in its always/cleanup step.
#
# Kept in its own task file so the preflight can be split out of the role
# entrypoint, which wraps it in block/rescue/always to guarantee the temporary
# mount is released even when a guard aborts the run.

- name: Require explicit confirmation
  ansible.builtin.assert:
    that:
      - confirm_restore | default(false) | bool
    fail_msg: >-
      Refusing to run: this {{ confirm_scope_note }}. Re-run with
      -e confirm_restore=true only after reviewing group_vars/all.yml.
    quiet: true

- name: Validate vm_name
  ansible.builtin.assert:
    that:
      - vm_name is defined
      - vm_name | length > 0
      - vm_name is match('^[A-Za-z0-9._-]+$')
    fail_msg: "vm_name must be a non-empty name matching ^[A-Za-z0-9._-]+$"
    quiet: true

- name: Ensure required host commands are available
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - "command -v {{ item }}"
  loop: "{{ snapshot_required_commands }}"
  register: snapshot_command_check
  changed_when: false
  failed_when: false

- name: Fail with a single clear message when commands are missing
  ansible.builtin.assert:
    that:
      - (snapshot_command_check.results | default([]) | rejectattr('rc', 'eq', 0) | length) == 0
    fail_msg: >-
      Missing required host commands:
      {{ snapshot_command_check.results | default([]) | rejectattr('rc', 'eq', 0)
         | map(attribute='item') | join(', ') }}. Install them before running
      the restore.
    quiet: true

- name: Resolve the Timeshift snapshot root directory
  when: timeshift_root | default('auto') == 'auto'
  block:
    - name: Find the root filesystem source
      ansible.builtin.command:
        cmd: findmnt --noheadings --output SOURCE --target /
      register: snapshot_root_source
      changed_when: false

    - name: Determine the device that holds the snapshots
      ansible.builtin.set_fact:
        snapshot_device: >-
          {{ timeshift_device
             if (timeshift_device | default('') | length) > 0
             else (snapshot_root_source.stdout | trim | regex_replace('\[[^]]*\]$', '')) }}

    - name: List all BTRFS mounts
      ansible.builtin.command:
        cmd: >-
          findmnt --raw --noheadings --output SOURCE,TARGET,FSROOT
          --types btrfs
      register: snapshot_btrfs_mounts
      changed_when: false
      failed_when: false

    - name: Resolve the BTRFS top-level mount for the snapshot device
      ansible.builtin.include_tasks: select_btrfs_top_mount.yml

    - name: Derive the Timeshift snapshot root from the top-level mount
      ansible.builtin.set_fact:
        snapshot_root_dir: "{{ snapshot_top_mount }}/timeshift-btrfs/snapshots"

- name: Use the explicitly configured Timeshift root directory
  ansible.builtin.set_fact:
    snapshot_root_dir: "{{ timeshift_root }}"
  when: timeshift_root | default('auto') != 'auto'

- name: Stat the Timeshift root directory
  ansible.builtin.stat:
    path: "{{ snapshot_root_dir }}"
  register: snapshot_root_stat

- name: Assert the Timeshift root directory exists
  ansible.builtin.assert:
    that:
      - snapshot_root_stat.stat.exists
      - snapshot_root_stat.stat.isdir
    fail_msg: >-
      Timeshift snapshot root '{{ snapshot_root_dir }}' does not exist. Mount
      the BTRFS top-level containing the Timeshift snapshots, verify that it
      has a timeshift-btrfs/snapshots directory, and check that
      timeshift_device selects the filesystem that holds those snapshots.
      Set timeshift_root explicitly when the snapshots are stored elsewhere.
    quiet: true

- name: List available snapshots
  ansible.builtin.find:
    paths: "{{ snapshot_root_dir }}"
    recurse: false
    file_type: directory
  register: snapshot_dirs

- name: Assert at least one snapshot is available
  ansible.builtin.assert:
    that:
      - snapshot_dirs.matched | int > 0
    fail_msg: "No Timeshift snapshots found under {{ snapshot_root_dir }}"
    quiet: true

- name: Resolve the snapshot name to restore
  ansible.builtin.set_fact:
    resolved_snapshot: >-
      {{ (snapshot_dirs.files | map(attribute='path') | map('basename')
          | sort | last)
         if (snapshot | default('latest')) == 'latest' else snapshot }}

- name: Assert the requested snapshot exists
  ansible.builtin.assert:
    that:
      - resolved_snapshot in (snapshot_dirs.files | map(attribute='path') | map('basename') | list)
    fail_msg: >-
      Snapshot '{{ resolved_snapshot }}' was not found under
      {{ snapshot_root_dir }}.
    quiet: true

- name: Set snapshot paths
  ansible.builtin.set_fact:
    snapshot_dir: "{{ snapshot_root_dir }}/{{ resolved_snapshot }}"
    snapshot_root: "{{ snapshot_root_dir }}/{{ resolved_snapshot }}/@"
    snapshot_home: "{{ snapshot_root_dir }}/{{ resolved_snapshot }}/@home"
    snapshot_info_file: "{{ snapshot_root_dir }}/{{ resolved_snapshot }}/info.json"

- name: Stat the snapshot subvolumes and metadata
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ snapshot_root }}"
    - "{{ snapshot_home }}"
    - "{{ snapshot_info_file }}"
  register: snapshot_paths

- name: Assert the snapshot subvolumes and metadata exist
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir if item.item != snapshot_info_file else item.stat.isreg
    fail_msg: "Missing or wrong type in the snapshot: {{ item.item }}"
    quiet: true
  loop: "{{ snapshot_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read the snapshot metadata (info.json)
  ansible.builtin.slurp:
    src: "{{ snapshot_info_file }}"
  register: snapshot_info_raw

- name: Parse the snapshot metadata
  ansible.builtin.set_fact:
    snapshot_info: "{{ snapshot_info_raw.content | b64decode | from_json }}"

- name: Assert the snapshot metadata describes @ and @home BTRFS subvolumes
  ansible.builtin.assert:
    that:
      - snapshot_info['type'] | default('') == 'btrfs'
      - "'@' in (snapshot_info['subvolumes'] | default({}))"
      - "'@home' in (snapshot_info['subvolumes'] | default({}))"
    fail_msg: >-
      Snapshot {{ resolved_snapshot }} has an invalid info.json: expected a
      BTRFS snapshot listing the @ and @home subvolumes.
    quiet: true

# Timeshift records origin as `created` (epoch) plus `sys-uuid` (DMI UUID) and
# `sys-distro`. It has never written a `hostname` key, and a DMI UUID survives a
# hostname rename, so it is the stronger identity of the two.
- name: Assert the snapshot declares provenance metadata
  ansible.builtin.assert:
    that:
      - snapshot_info['created'] | default('') | length > 0
      - snapshot_info['sys-uuid'] | default('') | length > 0
    fail_msg: >-
      Snapshot {{ resolved_snapshot }} does not declare its origin: info.json
      must carry 'created' and 'sys-uuid'. Keys present in
      {{ snapshot_info_file }}: {{ snapshot_info.keys() | sort | join(', ') }}.
    success_msg: "Snapshot provenance is complete"
    quiet: true

# The hostname is not part of info.json; read it from the snapshot's own tree.
# Informational only: a snapshot taken before /etc/hostname existed, or a
# synthetic test tree, must not fail the preflight over a display label.
- name: Read the hostname recorded inside the snapshot
  ansible.builtin.slurp:
    src: "{{ snapshot_root }}/etc/hostname"
  register: snapshot_hostname_raw
  changed_when: false
  failed_when: false

- name: Record snapshot provenance facts
  ansible.builtin.set_fact:
    snapshot_meta_created: "{{ snapshot_info['created'] | default('') }}"
    snapshot_meta_created_human: >-
      {{ '%Y-%m-%d %H:%M:%S' | strftime(snapshot_info['created'] | int)
         if (snapshot_info['created'] | default('') | string) is match('^[0-9]+$')
         else (snapshot_info['created'] | default('n/a')) }}
    snapshot_meta_sys_uuid: "{{ snapshot_info['sys-uuid'] | default('') }}"
    snapshot_meta_sys_distro: "{{ snapshot_info['sys-distro'] | default('') }}"
    snapshot_meta_hostname: >-
      {{ snapshot_hostname_raw.content | default('') | b64decode | trim
         if (snapshot_hostname_raw.content | default('') | length) > 0 else '' }}

- name: Detect the filesystem type of the snapshot root
  ansible.builtin.command:
    cmd: "stat --file-system --format=%T {{ snapshot_root_dir }}"
  register: snapshot_fs_type
  changed_when: false

- name: Validate the BTRFS snapshot subvolumes and read-only state
  when: snapshot_fs_type.stdout | trim == 'btrfs'
  block:
    - name: Inspect the snapshot @ subvolume
      ansible.builtin.command:
        cmd: "btrfs subvolume show {{ snapshot_root }}"
      register: snapshot_root_check
      changed_when: false
      failed_when: false

    - name: Inspect the snapshot @home subvolume
      ansible.builtin.command:
        cmd: "btrfs subvolume show {{ snapshot_home }}"
      register: snapshot_home_check
      changed_when: false
      failed_when: false

    - name: Assert the snapshot @ and @home are BTRFS subvolumes
      ansible.builtin.assert:
        that:
          - snapshot_root_check.rc == 0
          - snapshot_home_check.rc == 0
        fail_msg: >-
          Snapshot {{ resolved_snapshot }} is not a sendable BTRFS snapshot:
          {{ snapshot_root }} and {{ snapshot_home }} must both be BTRFS
          subvolumes. `btrfs send` can only stream subvolumes, and
          {{ snapshot_root }} (rc={{ snapshot_root_check.rc | default('n/a') }})
          or {{ snapshot_home }}
          (rc={{ snapshot_home_check.rc | default('n/a') }}) is not one.
        quiet: true

    # The snapshot passed the structural gate above; now tell it apart from the
    # live system the host is running from. This reads the real subvolume, so it
    # runs before the copy is taken: the copy gets a new subvolume ID and would
    # defeat the comparison.
    - name: Audit the boot state of the host against the snapshot
      ansible.builtin.include_tasks: audit_boot_state.yml

    - name: Measure how much disk space the snapshot holds
      ansible.builtin.include_tasks: report_snapshot_size.yml

    # Never stream the real snapshot. btrfs send refuses a read-write subvolume
    # and Timeshift snapshots are read-write, so the run takes a copy-on-write
    # read-only copy and points the pipeline at that instead. The real snapshot
    # is only ever read; nothing under it is modified or mounted read-write.
    - name: Take the disposable read-only copy the pipeline streams from
      ansible.builtin.include_tasks: stage_snapshot.yml

- name: Canonicalize the VM images directory
  ansible.builtin.command:
    cmd: "realpath --canonicalize-missing {{ vm_images_dir }}"
  register: vm_images_dir_real_cmd
  changed_when: false

- name: Canonicalize the VM disk path
  ansible.builtin.command:
    cmd: "realpath --canonicalize-missing {{ vm_disk }}"
  register: vm_disk_real_cmd
  changed_when: false

- name: Record the canonical destructive paths
  ansible.builtin.set_fact:
    vm_images_dir_real: "{{ vm_images_dir_real_cmd.stdout | trim }}"
    vm_disk_real: "{{ vm_disk_real_cmd.stdout | trim }}"

- name: Stat the VM images directory
  ansible.builtin.stat:
    path: "{{ vm_images_dir_real }}"
  register: vm_images_dir_stat

- name: Assert the VM disk lives inside the allowed images directory
  ansible.builtin.assert:
    that:
      - vm_images_dir_stat.stat.exists
      - vm_images_dir_stat.stat.isdir
      - vm_disk_real.startswith(vm_images_dir_real + '/')
      - vm_disk_real != vm_images_dir_real
    fail_msg: >-
      vm_disk '{{ vm_disk_real }}' must be a file strictly inside vm_images_dir
      '{{ vm_images_dir_real }}'.
    quiet: true

- name: Query free space on the VM disk filesystem
  ansible.builtin.command:
    cmd: "findmnt --noheadings --bytes --output AVAIL --target {{ vm_images_dir_real }}"
  register: vm_disk_avail_cmd
  changed_when: false

- name: Compute the required free space
  ansible.builtin.set_fact:
    vm_disk_required_bytes: >-
      {{ ((vm_disk_size | human_to_bytes) *
          (1 + (disk_space_headroom_percent | int) / 100)) | int }}

- name: Assert there is enough free space for the VM disk
  ansible.builtin.assert:
    that:
      - vm_disk_avail_cmd.stdout | trim | length > 0
      - (vm_disk_avail_cmd.stdout | trim | int) >= (vm_disk_required_bytes | int)
    fail_msg: >-
      Not enough free space on the filesystem holding {{ vm_images_dir_real }}:
      need {{ vm_disk_required_bytes }} bytes, have
      {{ vm_disk_avail_cmd.stdout | trim or 'unknown' }}.
    quiet: true

- name: Detect leftover state from a previous run
  when: not (force_cleanup | default(false) | bool)
  block:
    - name: Look for a leftover temporary disk from a previous run
      ansible.builtin.stat:
        path: "{{ vm_disk_real }}.new"
      register: snapshot_stale_new_disk

    - name: List mounts whose target lives under the work directory
      ansible.builtin.command:
        cmd: findmnt --raw --noheadings --output TARGET
      register: snapshot_stale_mounts
      changed_when: false
      failed_when: false

    - name: Detect NBD devices still serving the VM disk  # noqa command-instead-of-module
      ansible.builtin.shell: |
        set -euo pipefail
        for nbd in /sys/block/nbd*; do
          [ -e "$nbd/pid" ] || continue
          pid=$(cat "$nbd/pid") || continue
          if grep -q -- "{{ vm_disk_real }}" "/proc/$pid/cmdline" 2>/dev/null; then
            echo "/dev/$(basename "$nbd")"
          fi
        done
      args:
        executable: /bin/bash
      register: snapshot_stale_nbd
      changed_when: false
      failed_when: false

    - name: Compute the stale mounts and NBD devices
      ansible.builtin.set_fact:
        snapshot_stale_mount_list: >-
          {{ snapshot_stale_mounts.stdout_lines | default([])
             | select('search', work_dir) | list
             if (work_dir | default('') | length) > 0 else [] }}
        snapshot_stale_nbd_list: "{{ snapshot_stale_nbd.stdout_lines | default([]) }}"

    - name: Refuse to run over leftover state from a previous run
      ansible.builtin.assert:
        that:
          - not (snapshot_stale_new_disk.stat.exists | bool)
          - (snapshot_stale_mount_list | length) == 0
          - (snapshot_stale_nbd_list | length) == 0
        fail_msg: >-
          Leftover state found from a previous interrupted run (temporary
          disk: {{ vm_disk_real }}.new; mounts: {{ snapshot_stale_mount_list | join(', ') }};
          NBD devices: {{ snapshot_stale_nbd_list | join(', ') }}). Run
          `arch-timeshift-vm cleanup` (or pass -e force_cleanup=true) to remove
          it before restoring again.
        quiet: true

- name: Report the space held by the snapshot subvolumes
  when: (snapshot_size_report | default([]) | length) > 0
  ansible.builtin.debug:
    msg: >-
      Snapshot size : {{ item.subvolume }} total={{ item.total }}B
      exclusive={{ item.exclusive }}B shared={{ item.shared }}B
      (exclusive is the data unique to this snapshot; total is shared with its
      parent)
  loop: "{{ snapshot_size_report | default([]) }}"
  loop_control:
    label: "{{ item.subvolume }}"

- name: Report the snapshot subvolumes whose size could not be measured
  when: (snapshot_size_unavailable | default([]) | length) > 0
  ansible.builtin.debug:
    msg: >-
      Snapshot size : not available for
      {{ snapshot_size_unavailable | join(', ') }} (the filesystem refused to
      walk the subvolume)

- name: Report the resolved preflight
  ansible.builtin.debug:
    msg:
      - "Snapshot root : {{ snapshot_root_dir }}"
      - "Snapshot      : {{ resolved_snapshot }}"
      - "Real @        : {{ snapshot_source_root | default('n/a') }} (never modified)"
      - "Streams from  : {{ snapshot_root }}{{
                       ' (copy-on-write snapshot)' if snapshot_staged | default(false) else ' (real snapshot!)' }}"
      - "Provenance    : created={{ snapshot_meta_created_human }}"
      - "                host={{ snapshot_meta_hostname | default('unknown', true) }}"
      - "                uuid={{ snapshot_meta_sys_uuid | default('unknown', true) }}"
      - "                distro={{ snapshot_meta_sys_distro | default('unknown', true) }}"
      - "VM disk       : {{ vm_disk_real }}"
      - "Free space    : {{ vm_disk_avail_cmd.stdout | trim }} bytes"
      - >-
        Top-level     : {{ snapshot_top_mount | default('n/a') }}{{
                       ' (temporary, released at the end of this run)'
                       if (snapshot_top_mount_temporary | default(false)) | bool else '' }}
