---
# Select the BTRFS top-level mount (fsroot "/") that belongs to snapshot_device
# from an already-registered findmnt result in `snapshot_btrfs_mounts`.
# An empty result lets the caller mount the top-level temporarily if needed.

- name: Select the BTRFS top-level mount (fsroot "/") for the snapshot device
  ansible.builtin.set_fact:
    snapshot_top_mount: >-
      {{ snapshot_btrfs_mounts.stdout_lines | default([])
         | map('trim')
         | select('search',
             '^' ~ (snapshot_device | regex_escape) ~ '(\[[^]]*\])?\s+\S+\s+/\s*$')
         | map('regex_replace', '^\S+\s+(\S+)\s+/\s*$', '\1')
         | list | first | default('') }}
