---
- name: Initialize snapshot mount lifecycle state
  ansible.builtin.set_fact:
    snapshot_top_mount_owned: false
    snapshot_role_error: ""
    snapshot_cleanup_error: ""

- name: Resolve and validate the snapshot
  block:
    - name: Run snapshot preflight
      ansible.builtin.include_tasks: resolve_and_validate.yml
  rescue:
    - name: Record the snapshot preflight failure
      ansible.builtin.set_fact:
        snapshot_role_error: >-
          {{ ansible_failed_result.msg | default(ansible_failed_result | string) }}
  always:
    - name: Release the ephemeral BTRFS top-level after preflight failure
      ansible.builtin.include_tasks: unmount_btrfs_top.yml
      when: snapshot_role_error | length > 0

- name: Report snapshot preflight or cleanup failures
  ansible.builtin.assert:
    that:
      - snapshot_role_error | length == 0
      - snapshot_cleanup_error | length == 0
    fail_msg: >-
      {{ snapshot_role_error }}
      {{ snapshot_cleanup_error }}
    quiet: true
