---
libvirt_start: true
libvirt_uri: qemu:///system

libvirt_attach_iso: true

libvirt_graphics: spice
libvirt_gl_enable: false
libvirt_spice_rendernode: /dev/dri/by-path/pci-0000:00:02.0-render

libvirt_machine: ""

libvirt_undefine_before: true

libvirt_xml_validate: true

# VM networking mode: isolated (no NAT, no external access) by default,
# 'default' uses network_name (NAT), 'none' omits the NIC entirely.
vm_network_mode: isolated
libvirt_network_isolated_name: virbr-arch-timeshift-vm

libvirt_allow_missing_virsh: false
