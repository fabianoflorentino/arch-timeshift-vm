---
# Synthetic test seam: when true, the role tolerates a restored system that
# has no grub-install/mkinitcpio (the Tier 2 snapshot is intentionally empty).
# Production defaults to false so a missing bootloader is a hard failure.
boot_allow_missing_grub: false

# Restored root mountpoint published by the restore role. Falls back to the
# conventional work_dir/mnt-root layout when vm_mount_root is not provided.
boot_restored_root: "{{ vm_mount_root | default(work_dir + '/mnt') }}-root"

# Optional E2E-only guest health evidence. The marker is installed in the
# restored clone, never in the source snapshot. When the clone also ships
# qemu-guest-agent (binary + systemd unit), the role enables the agent inside
# the clone so the domain answers guest-ping over the virtio-serial channel;
# boot_guest_agent_available is published for the E2E verifier.
boot_guest_evidence_enabled: false
boot_guest_evidence_marker: /etc/arch-timeshift-vm/e2e-boot-ok
boot_guest_evidence_signature: ARCH_TIMESHIFT_VM_E2E_HEALTHY
